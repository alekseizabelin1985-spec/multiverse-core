# CI/CD пайплайн для валидации MD-блупринтов
# Запускается при каждом PR и push на main

name: Blueprint Validation

on:
  pull_request:
    paths:
      - 'configs/gm_*.yaml'
      - 'blueprints/**/*.md'
      - 'shared/agent/**/*.go'
  push:
    branches: [main]
    paths:
      - 'configs/gm_*.yaml'
      - 'blueprints/**/*.md'
      - 'shared/agent/**/*.go'

jobs:
  validate:
    name: Validate Blueprints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run blueprint validation tests
        run: go test ./shared/agent/... -v -run TestBlueprint

      - name: Run all agent tests
        run: go test ./shared/agent/... -count=1 -v

      - name: Check for YAML to MD conversion
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for new YAML configs that need MD conversion..."
          # Проверяем измененные YAML файлы
          changed_files=$(git diff --name-only HEAD^ HEAD | grep 'configs/gm_.*\.yaml' || true)
          if [ -n "$changed_files" ]; then
            echo "Found changed YAML configs:"
            echo "$changed_files"
            echo "⚠️  Remember to convert YAML configs to MD blueprints!"
            echo "Usage: go run shared/agent/cmd/yaml_blueprint_converter/main.go <input.yaml>"
          else
            echo "No YAML configs changed"
          fi

      - name: Validate blueprint syntax
        run: |
          echo "Validating all MD blueprints in blueprints/ directory..."
          if [ -d "blueprints" ]; then
            for md_file in blueprints/**/*.md; do
              if [ -f "$md_file" ]; then
                echo "Validating: $md_file"
                # TODO: добавить команду валидации
              fi
            done
          else
            echo "No blueprints directory found"
          fi

      - name: Lint Go code
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Check code coverage
        run: go test ./shared/agent/... -coverprofile=coverage.out -covermode=count
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.out
          fail_ci_if_error: false
