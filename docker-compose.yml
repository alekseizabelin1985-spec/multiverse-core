# =============================================================================
# docker-compose.yml — MVP-1 topology (EPIC-001; core F-6a/T-004, profiles and
# init containers F-6b/T-008)
# =============================================================================
# Source of truth: Docs/dev-team/architecture/infrastructure.md v0.3 §1.2–§1.4,
# §3.1.1, §5.1, §5.2, §5.3, §6.1; ADR-001 add. 4/6, ADR-005 add. 2, ADR-021.
#
# How to run it (infrastructure.md §1.1, §9.1):
#   COMPOSE_ENV_FILES=.env,build/versions.env   (declared in .env / .env.example)
#   make llm-up      native llama-server, outside compose
#   make up          docker compose up -d --wait, then make health
# Version pins never live in this file — only ${...} out of build/versions.env.
#
# Profiles (§1.3; `make up PROFILES=memory,bot` or COMPOSE_PROFILES in .env):
#   (none)   redpanda, redpanda-init, minio, minio-init, gateway, core
#   memory   qdrant, neo4j, memory
#   gpu      ollama — only with MV_LLM_PROVIDER=ollama and only in a container
#   dev      redpanda-console
#   bot      telegram-bot
#   legacy   narrative-orchestrator, semantic-memory, chromadb (+ neo4j)
#
# House rules enforced by scripts/compose-lint.sh (§3.1.1):
#   1. every image carries an explicit tag out of build/versions.env, no latest;
#   2. every published port is bound to 127.0.0.1 (SEC-13); the init containers,
#      chromadb and narrative-orchestrator publish nothing; consoles only in
#      profile `dev` (SEC-33);
#   3. no default passwords: secrets appear as ${VAR:?} and nowhere else;
#   4. MV_TELEGRAM_BOT_TOKEN reaches the telegram-bot service only (D-10);
#   5. NEO4J_PLUGINS is absent (T-17), OLLAMA_ORIGINS is not a wildcard and
#      OLLAMA_HOST is not 0.0.0.0 (SEC-15);
#   6. there is no `llama-server` service — the LLM runs natively on the host at
#      127.0.0.1:1234 and containers reach it through host.docker.internal
#      (ADR-005 add. 2 p. 7) — and MV_LLM_URL points at loopback,
#      host.docker.internal, a compose service or an RFC1918 host, never at a
#      public one.
#
# Known limitation of a single compose file (T-008; dev-log ОВ-40): a port
# publication cannot be made conditional on a profile. Where §1.4 asks for a
# console "only in profile dev" but the console shares its service with a
# non-console port (MinIO 9001, Neo4j 7474), this file takes the stricter
# reading of SEC-33 and does not publish it at all; `docker compose port` or a
# local, git-ignored docker-compose.override.yml gives the operator access.
# =============================================================================

# Log rotation of the platform: 50m x 5 (ADR-006 add. 5).
x-logging: &platform-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# The bot writes far less and its lines carry a redacted token: 10m x 3.
x-bot-logging: &bot-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every process is the same image with a different --contexts set (ADR-001,
# NFR-075); build/Dockerfile carries no HEALTHCHECK because the port depends on
# the role, so each service declares its own probe against its own binary.
x-platform: &platform
  image: multiverse-core:${MV_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: build/Dockerfile
    args:
      GO_VERSION: ${GO_VERSION}
      VERSION: ${MV_IMAGE_TAG:-dev}
  restart: unless-stopped
  logging: *platform-logging

# The variables every platform process reads (shared/env manifest, T-007).
x-platform-env: &platform-env
  MV_ENV: ${MV_ENV:-dev}
  MV_LOG_LEVEL: ${MV_LOG_LEVEL:-info}
  MV_LOG_FORMAT: ${MV_LOG_FORMAT:-json}
  MV_MODE: ${MV_MODE:-live}
  MV_BUS: ${MV_BUS:-redpanda}
  MV_BUS_VALIDATE_ON_READ: ${MV_BUS_VALIDATE_ON_READ:-true}
  MV_KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-redpanda:9092}
  MV_MINIO_ENDPOINT: ${MV_MINIO_ENDPOINT:-minio:9000}
  MV_MINIO_ACCESS_KEY: ${MV_MINIO_ACCESS_KEY:?set MV_MINIO_ACCESS_KEY in .env}
  MV_MINIO_SECRET_KEY: ${MV_MINIO_SECRET_KEY:?set MV_MINIO_SECRET_KEY in .env}
  MV_MINIO_USE_SSL: ${MV_MINIO_USE_SSL:-false}
  MV_WORLD_ID: ${MV_WORLD_ID:-dark-forest-world}

# The platform starts only after the bus and the object store are not merely
# healthy but initialised: topics with their retention (§5.1) and the
# ops-artifacts bucket with the service user (§5.2). Replaces the pair of
# `service_healthy` conditions the core carried in T-004.
x-depends-on-init: &depends-on-init
  redpanda-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully

services:
  # ========================= event bus (always on) ===========================
  redpanda:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE in build/versions.env}
    # Two listeners (§1.4): `internal` serves the containers, `external` serves
    # `go run` on the host and mvctl, which publishes to the bus directly.
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    # Replaces the as-is `sleep 10` of redpanda-init (§5.1).
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *platform-logging

  # The 8 topics with their retention and a daily segment (§5.1, ADR-007, D-9,
  # U-3). Idempotent: creates what is missing, converges the config of what is
  # already there, so it runs on every `make up`. Publishes nothing.
  redpanda-init:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE in build/versions.env}
    entrypoint: ["/bin/bash", "/redpanda-init.sh"]
    environment:
      RPK_BROKERS: ${MV_KAFKA_BROKERS:-redpanda:9092}
    volumes:
      - ./build/redpanda-init.sh:/redpanda-init.sh:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    logging: *platform-logging

  # ===================== object store (always on, ADR-021) ===================
  minio:
    # Built from source, not pulled: see build/minio.Dockerfile. `make
    # minio-image` builds the same image outside compose.
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    build:
      context: .
      dockerfile: build/minio.Dockerfile
      args:
        MINIO_BUILDER_IMAGE: ${MINIO_BUILDER_IMAGE}
        MINIO_TAG: ${MINIO_TAG}
        MINIO_REPO: ${MINIO_REPO}
    environment:
      # No defaults on purpose (§3.1.1 rule 3): an unset credential must stop
      # the stack, not silently recreate the well known as-is account.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (>= 16 chars)}
    ports:
      # The console (9001) is not published — see the header note on profiles.
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data
    # The image ships the same probe; repeated here so that `depends_on` reads
    # in one place and does not depend on the image being rebuilt.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *platform-logging

  # ops-artifacts, the service user and the versioning/ILM safety net (§5.2).
  # The per-world buckets are created by the platform (objstore.EnsureBucket,
  # `mvctl world init`); this container only converges the ones that already
  # exist, with the very same rule id and body — see build/minio-init.sh.
  minio-init:
    image: ${MC_IMAGE:?set MC_IMAGE in build/versions.env}
    # bash, not sh: the mc image ships bash + coreutils and no sed/grep/awk,
    # and the script parses `mc ls` with bash builtins only.
    entrypoint: ["/bin/bash", "/minio-init.sh"]
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (>= 16 chars)}
      MV_MINIO_ACCESS_KEY: ${MV_MINIO_ACCESS_KEY:?set MV_MINIO_ACCESS_KEY in .env}
      MV_MINIO_SECRET_KEY: ${MV_MINIO_SECRET_KEY:?set MV_MINIO_SECRET_KEY in .env}
    volumes:
      - ./build/minio-init.sh:/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    logging: *platform-logging

  # ========================= platform (always on) ============================
  gateway:
    <<: *platform
    command: ["--contexts=gateway"]
    environment:
      <<: *platform-env
      # Wave 0: cmd/multiverse reads the address of the process HTTP server from
      # MV_CORE_ADDR whatever the role (serve.go, D-7); EPIC-004 moves the
      # gateway onto MV_GATEWAY_ADDR, and this line disappears with it.
      MV_CORE_ADDR: ${MV_GATEWAY_ADDR:-:8088}
      MV_GATEWAY_ADDR: ${MV_GATEWAY_ADDR:-:8088}
      MV_GATEWAY_DATA_DIR: ${MV_GATEWAY_DATA_DIR:-/data}
      MV_GATEWAY_CLIENT_IDS: ${MV_GATEWAY_CLIENT_IDS:-telegram-bot,mvctl}
      MV_GATEWAY_ACTOR_KIND_CLIENTS: ${MV_GATEWAY_ACTOR_KIND_CLIENTS:-mvctl}
      MV_CORE_URL: ${MV_CORE_URL:-http://core:8090}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      # Named volume, never a bind mount: links.db holds player identifiers
      # (ADR-004 add. 4, T-8).
      - gateway-data:/data
    healthcheck:
      # The image has neither shell nor curl (§2.3): the binary probes itself.
      test: ["CMD", "/multiverse", "health", "--url", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on: *depends-on-init

  core:
    <<: *platform
    command: ["--contexts=state,mechanics,laws,llm,swarm"]
    # The LLM is a native process on the host, outside compose (ADR-005 add. 2
    # p. 7): this is the only way containers reach 127.0.0.1:1234.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *platform-env
      MV_CORE_ADDR: ${MV_CORE_ADDR:-:8090}
      MV_CORE_ADMIN_CLIENTS: ${MV_CORE_ADMIN_CLIENTS:-operator}
      # Empty value = memory is off, a documented degradation (FR-035); with the
      # `memory` profile set MV_MEMORY_URL=http://memory:8082 in .env.
      MV_MEMORY_URL: ${MV_MEMORY_URL:-}
      MV_SNAPSHOT_EVERY_FACTS: ${MV_SNAPSHOT_EVERY_FACTS:-200}
      MV_GM_PATH: ${MV_GM_PATH:-agent}
      MV_LAWS_BREACH_PHASE: ${MV_LAWS_BREACH_PHASE:-false}
      MV_LLM_PROVIDER: ${MV_LLM_PROVIDER:-openai_compat}
      MV_LLM_URL: ${MV_LLM_URL:-http://host.docker.internal:1234}
      MV_LLM_API_KEY: ${MV_LLM_API_KEY:-}
      MV_LLM_NUM_CTX: ${MV_LLM_NUM_CTX:-8192}
      MV_LLM_STORE_PROMPTS: ${MV_LLM_STORE_PROMPTS:-false}
      MV_LLM_CLOUD_ENABLED: ${MV_LLM_CLOUD_ENABLED:-false}
      MV_LLM_CLOUD_ALLOW_EXTERNAL_PLAYERS: ${MV_LLM_CLOUD_ALLOW_EXTERNAL_PLAYERS:-false}
      MV_LLM_CLOUD_BUDGET_USD_PER_DAY: ${MV_LLM_CLOUD_BUDGET_USD_PER_DAY:-0}
    # No published port on purpose: the admin API of `core` is reached through
    # the gateway proxy (ADR-009 p. 9, threat-model T-14). Compose's internal
    # network is enough for gateway -> core; publish it only for local debugging.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "/multiverse", "health", "--url", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on: *depends-on-init

  # ======================== memory (profile memory) ==========================
  # Should-level capability (EPIC-005): without it `core` degrades (FR-035).
  qdrant:
    profiles: ["memory"]
    image: ${QDRANT_IMAGE:?set QDRANT_IMAGE in build/versions.env}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    # No API key on purpose: the ports are loopback only (§5.3, SEC-31).
    # The image ships neither curl nor wget, but it does ship bash. CMD-SHELL is
    # /bin/sh -c and /bin/sh here is dash, which has no /dev/tcp, so bash is
    # invoked explicitly (§5.3).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging: *platform-logging

  neo4j:
    # Also raised by `legacy`: the as-is semantic-memory writes its graph here
    # (§1.3, D-3), so the two profiles share one server.
    profiles: ["memory", "legacy"]
    image: ${NEO4J_IMAGE:?set NEO4J_IMAGE in build/versions.env}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      # NEO4J_PLUGINS is absent on purpose (T-17, SEC-32): APOC is not used by
      # any code we run, and apoc.load.*/apoc.import.* reach the file system.
    ports:
      # 7474 (Browser) is not published — see the header note on profiles.
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *platform-logging

  memory:
    <<: *platform
    profiles: ["memory"]
    command: ["--contexts=memory"]
    environment:
      <<: *platform-env
      # D-7 again: the process HTTP server address comes from MV_CORE_ADDR.
      MV_CORE_ADDR: ${MV_MEMORY_ADDR:-:8082}
      MV_MEMORY_ADDR: ${MV_MEMORY_ADDR:-:8082}
      MV_QDRANT_ADDR: ${MV_QDRANT_ADDR:-qdrant:6334}
      MV_NEO4J_URI: ${MV_NEO4J_URI:-neo4j://neo4j:7687}
      MV_NEO4J_USER: ${MV_NEO4J_USER:-neo4j}
      MV_NEO4J_PASSWORD: ${MV_NEO4J_PASSWORD:?set MV_NEO4J_PASSWORD in .env}
      MV_EMBED_MODEL: ${MV_EMBED_MODEL:-nomic-embed-text}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "/multiverse", "health", "--url", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      <<: *depends-on-init
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # ===================== optional LLM runtime (profile gpu) ==================
  # Only needed when MV_LLM_PROVIDER=ollama or for embeddings (ADR-005 add. 2
  # p. 8, §6.5). The default runtime, llama-server, is native and has no service
  # here on purpose.
  ollama:
    profiles: ["gpu"]
    image: ${OLLAMA_IMAGE:?set OLLAMA_IMAGE in build/versions.env}
    environment:
      # OLLAMA_HOST is deliberately left alone: the image already binds to the
      # container interface, and pinning it to 0.0.0.0 here would be the very
      # thing SEC-15 forbids. The port below is loopback only.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
      # Never a wildcard (SEC-15): only the loopback origins the operator uses.
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS:-http://127.0.0.1,http://localhost}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama ps >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *platform-logging

  # ========================= developer tools (dev) ===========================
  # The only console this file publishes, and only here (SEC-33, T-32). Its
  # environment is the broker address and nothing else: the as-is service read
  # the whole .env and showed it in the UI.
  redpanda-console:
    profiles: ["dev"]
    image: ${REDPANDA_CONSOLE_IMAGE:?set REDPANDA_CONSOLE_IMAGE in build/versions.env}
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVER_LISTENPORT: "8080"
    ports:
      - "127.0.0.1:8092:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    logging: *platform-logging

  # ============================ bot (profile bot) ============================
  # The token lives here and nowhere else (D-10, compose-lint rule 4); no
  # env_file, because .env carries the token to whoever reads it.
  telegram-bot:
    profiles: ["bot"]
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
        VERSION: ${MV_IMAGE_TAG:-dev}
    # The binary lands in EPIC-004; build/Dockerfile already copies everything
    # under ./cmd, so this line starts working the moment cmd/telegram-bot
    # exists — no change to this file.
    entrypoint: ["/telegram-bot"]
    environment:
      MV_ENV: ${MV_ENV:-dev}
      MV_LOG_LEVEL: ${MV_LOG_LEVEL:-info}
      MV_LOG_FORMAT: ${MV_LOG_FORMAT:-json}
      MV_TELEGRAM_BOT_TOKEN: ${MV_TELEGRAM_BOT_TOKEN:?set MV_TELEGRAM_BOT_TOKEN in .env}
      MV_TELEGRAM_ALLOWED_USER_IDS: ${MV_TELEGRAM_ALLOWED_USER_IDS:-}
      MV_TELEGRAM_GATEWAY_URL: ${MV_TELEGRAM_GATEWAY_URL:-http://gateway:8088}
      MV_TELEGRAM_POLL_TIMEOUT_S: ${MV_TELEGRAM_POLL_TIMEOUT_S:-25}
      MV_TELEGRAM_HEALTH_ADDR: ${MV_TELEGRAM_HEALTH_ADDR:-:8089}
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test: ["CMD", "/telegram-bot", "health", "--url", "http://127.0.0.1:8089/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: *bot-logging

  # ========================== legacy (profile legacy) ========================
  # As-is narrative-orchestrator + semantic-memory + Chroma, kept alive only
  # while MV_GM_PATH=legacy (S5, D-3, ADR-004 add. 8). The sections come from
  # services/_archive/build/docker-compose.as-is.yml; the services are frozen
  # and read their as-is variable names (no MV_ prefix, outside the shared/env
  # registry, §4.1 p. 2). The whole profile disappears in EPIC-003 I2.
  #
  # Viability of this profile is an open question of T-008 — see dev-log ОВ-41:
  # the frozen code imports shared/config, shared/minio, shared/oracle and
  # shared/spatial, which F-3 moved to services/_archive/shared/, and F-2
  # deleted the go.work that used to bind them together.
  chromadb:
    profiles: ["legacy"]
    # Deliberately without a default: build/versions.env leaves CHROMA_IMAGE
    # empty because which server tag serves the frozen chroma-go client is
    # decided on the stand (D-3). An empty image fails loudly here; a guessed
    # tag would fail silently at runtime.
    image: ${CHROMA_IMAGE:?set CHROMA_IMAGE in build/versions.env once the tag is decided (T-008, D-3)}
    environment:
      IS_PERSISTENT: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      # The as-is volume name on purpose: §5.5 keeps the Chroma data until the
      # profile is removed, unlike the redpanda/minio volumes which T-004
      # renamed so that as-is data is not silently remounted.
      - chroma_data:/chroma/chroma
    # Publishes nothing (§1.4): only semantic-memory talks to it.
    expose:
      - "8000"
    restart: unless-stopped
    logging: *platform-logging

  semantic-memory:
    profiles: ["legacy"]
    build:
      # The as-is workspace, exported from LEGACY_SRC_REF by
      # `make legacy-src`; the work tree no longer compiles this code.
      context: build/.legacy-src
      dockerfile: ../legacy.Dockerfile
      args:
        SERVICE: semantic-memory
        GO_BUILD_TAGS: chroma_v2_enabled
        BUILD_CGO: "1"
        LEGACY_GO_IMAGE: ${LEGACY_GO_IMAGE}
        LEGACY_RUNTIME_IMAGE: ${LEGACY_RUNTIME_IMAGE}
        LEGACY_ONNXRUNTIME_VERSION: ${LEGACY_ONNXRUNTIME_VERSION}
        LEGACY_ONNXRUNTIME_SHA256: ${LEGACY_ONNXRUNTIME_SHA256}
    image: multiverse-core-legacy:semantic-memory-${MV_IMAGE_TAG:-dev}
    environment:
      KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-redpanda:9092}
      CHROMA_URL: http://chromadb:8000
      CHROMA_USE_V2: "true"
      CHROMA_COLLECTION_NAME: ${LEGACY_CHROMA_COLLECTION:-multiverse_events}
      NEO4J_URI: ${MV_NEO4J_URI:-neo4j://neo4j:7687}
      NEO4J_USER: ${MV_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      MINIO_ENDPOINT: ${MV_MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MV_MINIO_ACCESS_KEY:?set MV_MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MV_MINIO_SECRET_KEY:?set MV_MINIO_SECRET_KEY in .env}
      SEMANTIC_PORT: "8082"
    ports:
      # 8083 on the host so that it does not collide with the target `memory`
      # service, which owns 8082 (§1.4).
      - "127.0.0.1:8083:8082"
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_started
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    logging: *platform-logging

  narrative-orchestrator:
    profiles: ["legacy"]
    build:
      # The as-is workspace, exported from LEGACY_SRC_REF by
      # `make legacy-src`; the work tree no longer compiles this code.
      context: build/.legacy-src
      dockerfile: ../legacy.Dockerfile
      args:
        SERVICE: narrative-orchestrator
        LEGACY_GO_IMAGE: ${LEGACY_GO_IMAGE}
        LEGACY_RUNTIME_IMAGE: ${LEGACY_RUNTIME_IMAGE}
    image: multiverse-core-legacy:narrative-orchestrator-${MV_IMAGE_TAG:-dev}
    environment:
      KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-redpanda:9092}
      SEMANTIC_MEMORY_URL: http://semantic-memory:8082
      MINIO_ENDPOINT: ${MV_MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MV_MINIO_ACCESS_KEY:?set MV_MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MV_MINIO_SECRET_KEY:?set MV_MINIO_SECRET_KEY in .env}
      # The as-is orchestrator calls an OpenAI-compatible endpoint; on this
      # stand that is the native llama-server, same as the target `core`.
      ORACLE_URL: ${LEGACY_ORACLE_URL:-http://host.docker.internal:1234/v1/chat/completions}
      ORACLE_MODEL: ${LLM_MODEL_DEFAULT}
      ORACLE_TIMEOUT_MS: ${LEGACY_ORACLE_TIMEOUT_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Publishes nothing (§1.4): it only reads the bus and writes narrative.
    depends_on:
      redpanda:
        condition: service_healthy
      semantic-memory:
        condition: service_started
    restart: unless-stopped
    logging: *platform-logging

volumes:
  # Target volumes are named apart from the as-is ones (`redpanda_data`,
  # `minio_data`, `ollama_data`): with the same COMPOSE_PROJECT_NAME the old
  # data — including the as-is MinIO root credentials — would otherwise be
  # mounted silently on the first `up` (§5.5, D-8; review T-004, Mi-2).
  # `make archive-legacy` copies the as-is volumes before they are removed.
  redpanda-data:
  minio-data:
  gateway-data:
  ollama-data:
  qdrant-storage:
  neo4j-data:
  # The one volume that keeps its as-is name on purpose (§5.5): the Chroma data
  # stays until the `legacy` profile is removed in EPIC-003 I2.
  chroma_data:
