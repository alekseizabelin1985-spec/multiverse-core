# .pre-commit-config.yaml — Windows-совместимо (без bash-зависимостей).
# Источник: Docs/dev-team/architecture/infrastructure.md v0.3 §3.4 (F-1).
# Версии — Docs/dev-team/architecture/infrastructure.md §2.4 (после F-6a — build/versions.env).
# Архив кода (F-3, T-002): содержимое переносится `git mv` без изменений (U-1),
# поэтому автофиксеры его не трогают — exclude стоит пофайлово на каждом из них
# (ревью T-002, M-1). Проверки безопасности и целостности (gitleaks,
# check-added-large-files, check-yaml, check-merge-conflict) действуют и на архив.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks              # entry: gitleaks git --pre-commit --redact --staged --verbose
  # Локальные хуки, а не сборка второй копии линтера. Причина измерена
  # 2026-09-11: хук из репозитория golangci-lint строит СВОЙ бинарник, и он
  # обходил скрытые каталоги рядом с проектом — `.claude/worktrees` (132 файла
  # чужого рабочего дерева) и `build/.legacy-src` (93 файла выгрузки
  # замороженных сервисов), — переписывая их формат. Правки не отслеживаемых
  # файлов срывали коммит на восстановлении укладки, и так пять раз подряд.
  # Установленный `golangci-lint` той же версии (build/versions.env,
  # GOLANGCI_LINT_VERSION) их не трогает: он уважает исключения `.golangci.yml`
  # и не заходит в скрытые каталоги. Один инструмент, одна версия, одно
  # поведение — то же правило, по которому сведён адрес LLM в T-404.
  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: golangci-lint
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']    # ловит .exe/.pdf
      - id: end-of-file-fixer
        exclude: '^services/_archive/'
      - id: check-yaml
        exclude: '^services/_archive/'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
        files: '\.(sh|yml|yaml|toml)$|^Makefile$'
        exclude: '^services/_archive/'
