# HTTP API v1 of the gateway (contract C-08 v1.3, owner EPIC-004).
#
# Sources: architecture/contracts.md C-08 v1.3 and C-04 v1.3 (group without a
# leader, /forget cascade), C-01 v1.7 (process HTTP server, /health),
# analysis/api-contracts.md §1, components/gateway-and-bot.md §5.2–§5.6.
#
# Skeleton of T-301: operations, parameters, schemas and error responses.
# Handlers and the response bodies they need are refined task by task
# (T-303 links, T-305 actions, T-306 characters and worlds, ...). The Go wire
# types live in internal/gateway/api/dto.go, the error codes in errors.go;
# internal/gateway/api/openapi_test.go keeps them, the route table and this
# file in step.
#
# Section "admin": the gateway owns this file, EPIC-003 owns the text of
# /v1/admin/agents* and /v1/admin/llm/usage (C-06, co-ownership). Those
# operations are reserved here (x-reserved) and are written by EPIC-003 T-239.
openapi: 3.1.0
info:
  title: Multiverse gateway API
  version: 1.0.0
  description: |
    Player entry point of the platform: links and consent, characters, actions,
    groups, deliveries of results. Clients are the Telegram bot and the CI
    harness; both use internal/gateway/client.

    Every answer carries the header X-Request-Id (components.headers.XRequestId;
    set by the middleware of component §5.1, T-303), so operations do not repeat it.

    Every error answer has the body {"error": {"code", "message", "details"}}.
    A client matches on code; message is plain Russian text for the player.
servers:
  - url: http://127.0.0.1:8088
security:
  - ClientId: []
tags:
  - name: links
    description: Links of external accounts, consent, /forget. Bodies are never logged (SEC-01/02).
  - name: characters
    description: Worlds and characters.
  - name: actions
    description: Player actions (C-04 v1.3).
  - name: groups
    description: Groups (read side).
  - name: deliveries
    description: Long-poll of the outbox and acknowledgements.
  - name: service
    description: Service operations of the gateway itself for the CI harness and the operator (api-contracts.md §1.8).
  - name: admin
    description: |
      Reserved. Proxy of /v1/admin/agents* and /v1/admin/llm/usage to the process HTTP server of core
      (MV_CORE_URL, C-06). The operations are specified by EPIC-003 T-239
      through a change to this file reviewed by EPIC-004.
  - name: process
    description: |
      Endpoints of the process HTTP server (shared/runtime, cmd/multiverse; C-01 v1.7, v1.9), not of the gateway
      context: the gateway does not mount them, and its proxy of /v1/admin/* to core does not pass them.

paths:
  /v1/links/resolve:
    post:
      operationId: resolveLink
      tags: [links]
      summary: Resolve an external account into a player
      description: |
        Creates a pending_consent link with a new link_id on the first call and
        updates last_seen_at on every call. link_id is not returned (SEC-03).
        notice_due is true for a new or pending_consent link and when the
        previous visit was 30 days ago or more. character_status is none while
        the link has no character. external_platform other than telegram and an
        empty external_id answer 400 invalid_request.
      x-nolog: true
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveRequest' }
      responses:
        '200':
          description: The state of the link and of the character.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/links/consent:
    post:
      operationId: consentLink
      tags: [links]
      summary: Record the notice, the consent and the age confirmation
      description: |
        Any of the three flags not true answers 400 consent_incomplete: an
        existing link stays pending_consent, and an account without a link
        gets none (nothing stores its external ID). A complete consent sets
        notice_shown_at to shown_at and consent_at, age_confirmed_at to the time
        of the gateway; a repeat keeps the first three times (they are the
        evidence of the consent) and only updates last_seen_at. A complete
        consent for an account that was never resolved creates its link.
        shown_at missing answers 400 invalid_request.
      x-nolog: true
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '200':
          description: The link is consented.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/links:
    delete:
      operationId: forgetLink
      tags: [links]
      summary: Delete the link (/forget)
      description: |
        Cascade of C-04 v1.3 in this order: the outbox of the player is dropped;
        a living character gets status=abandoned (and a new leader or none for
        its group), group.left {cause: forget}; the active session ends with
        end_reason=forget; the link is deleted physically. A step that fails
        stops the cascade before the deletion, so a repeat runs it again: the
        answer is 500 internal, and from T-355, when the bus fails, 503
        bus_unavailable (some steps may have run, the link stays, a repeat is
        safe).

        What is deleted (SEC-26, threat-model §4.8): the row of the link — the
        external ID, player_id, world_id, the times of the notice, the consent
        and the age confirmation, last_seen_at, the internal link_id — and the
        stored answers of POST /v1/characters under that link. The deletion is
        physical before the answer: secure_delete zeroes the cells, the free
        pages are vacuumed and the WAL is checkpointed and truncated, so the
        external ID is left neither in the file nor in its WAL, and nothing
        finds the external account by player_id any more.

        What stays: the character under its pseudonymous player_id (abandoned,
        or dead) in the world state and snapshots; the game history by player_id
        in the event journal until its retention (30 days, LLM records 90,
        analytics 180) and in the memory indexes built from it; sessions and
        turns of gateway.db by player_id; the encrypted backup of the links file
        for at most 30 days. A new /start after /forget is a new player with a
        new player_id.

        Answers: 200 {deleted: true, player_id_detached} when a link was deleted,
        player_id_detached null when it had no character (the client says there
        was nothing to delete); 200 {deleted: false, player_id_detached: null}
        without a link, which is also the answer to a repeat of a /forget that
        already succeeded.

        503 forget_incomplete, unlike bus_unavailable, does not mean that nothing
        was done: the link is deleted, but the wipe of its bytes from the file of
        links is not confirmed. Causes: a reader outside the gateway, such as a
        backup, holding the file past the busy timeout, or the deadline of the
        request. The data must not be reported as gone. While that wipe stays
        pending, every /forget answers 503 forget_incomplete, the repeats of the
        same account and the /forget of other accounts, with or without a link;
        the call that finishes the wipe answers as usual. The answer carries
        Retry-After: the caller repeats not earlier than Retry-After, and the
        reference client does not repeat it by itself; a 200 {deleted: false}
        after a 503 is the end of the same /forget, not "nothing to delete". The gateway
        also finishes the wipe itself: its sweeper retries every minute, and
        every start of the gateway compacts the file of links.
      x-nolog: true
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgetRequest' }
      responses:
        '200':
          description: What was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForgetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ForgetIncomplete' }

  /v1/admin/links/{player_id}:
    delete:
      operationId: adminForgetLink
      tags: [service]
      summary: Delete the link of a player (operator)
      description: The same cascade as forgetLink, addressed by player_id. Operator clients only.
      x-actor-kind: [ci]
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: What was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForgetResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ForgetIncomplete' }

  /v1/worlds:
    get:
      operationId: listWorlds
      tags: [characters]
      summary: List the worlds
      description: |
        Every world of the projection of the gateway, by world_id, with its
        regions by region_id and laws_version. No world yet is an empty list.
        llm.cloud_enabled is the last config.cloud_enabled seen by the gateway,
        false by default (C-08 v1.2, SEC-21); until the gateway projects that
        event (T-320) it is always false.
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      responses:
        '200':
          description: The worlds with their regions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorldsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/characters:
    post:
      operationId: createCharacter
      tags: [characters]
      summary: Create a character
      description: |
        The gateway proposes the character to State (entity.create.proposed)
        and waits for its fact up to MV_GATEWAY_CHARACTER_WAIT (2 s): 201 with
        the character when it comes in time, 202 {player_id, status: creating}
        when it does not. A creating character reads status=creating in
        GET /v1/players/{player_id} and character_status=creating in
        resolveLink until its fact comes; without the fact by
        MV_GATEWAY_CHARACTER_DEADLINE (60 s), or refused by State, it is taken
        off the link, reads player_not_found and none, and the next request
        creates a new player_id.

        Checks, in this order; the first that fails is the answer:
        invalid_request (external_platform other than telegram, an empty
        external_id, action_key missing or longer than 64 bytes);
        consent_required (no link, or a link not consented); then the answer
        kept under the key; then the character of the link: 200
        {created: false} with the living character (a second one is not
        created), 202 again for one still creating; a dead or abandoned
        character is replaced by a new player_id on the same link;
        world_not_found (nothing is proposed); name_required (empty after trim),
        name_invalid (2..32 characters: letters, digits, space, hyphen, no two
        spaces in a row, no combining marks). The name then goes through the
        input filter of the gateway (FR-056) and the result is checked by the
        same rule: a name the filter blocks or turns into no name is
        name_invalid, a failure of the filter is 422 filter_error; the proposal
        gets the name the filter returned.

        Idempotency (C-08 v1.1, SEC-03): 200, 201 and 202 are kept under
        (link_id, action_key) for 24 hours in the file of links, which /forget
        deletes with the link; a repeat returns the first answer and the same
        player_id. A refusal is not kept: a repeat checks again. 503
        bus_unavailable means the proposal did not go out: the repeat with the
        same key proposes the same player_id under the same proposal_id, which
        State applies once. 500 internal answers a creation State refused.
        link_id is never returned, and gateway.db holds neither the external
        account nor link_id.
      x-nolog: true
      x-idempotency: action_key
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCharacterRequest' }
      responses:
        '200':
          description: A living character already exists (created=false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateCharacterResponse' }
        '201':
          description: The character is created (created=true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateCharacterResponse' }
        '202':
          description: Creation accepted, the fact is not there yet (status=creating).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateCharacterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/players/{player_id}:
    get:
      operationId: getPlayer
      tags: [characters]
      summary: State of a character
      description: |
        Not a turn, publishes nothing. The character as the projection of the
        gateway holds it: status (alive, dead, abandoned), hp, position (kind
        region or outside), scope, group, the open encounter with its NPCs,
        inventory, the weather and time of the world when the world has them,
        the active session of its scope (session_id, turns_count) and version.
        While creating, only player_id, name, world_id and status=creating are
        present. A player the gateway knows neither from its projection nor as
        a creating character is 404 player_not_found.
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: The character.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterState' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/players/{player_id}/actions:
    post:
      operationId: postAction
      tags: [actions]
      summary: Send an action
      description: |
        202 after validation and the broker acknowledgement, and nothing else is
        waited for (C-08: p95 <= 300 ms): the result of the action comes as
        deliveries. correlation_id is the id of the published player.* event.
        group.* answers 200 with the group when the fact arrives within
        MV_GATEWAY_FACT_WAIT, otherwise 202 with status=pending; until the
        groups of increment I2 (T-352) it answers 501 not_implemented.

        Idempotency (C-08): the answer is kept under (player_id, action_key) for
        24 hours. A repeat of action_key returns the first answer (the same
        correlation_id, or the same 4xx) and publishes nothing. 503
        bus_unavailable means the action was not accepted and the key was not
        stored: the client repeats with the same key. A request without
        action_key, or with one longer than 64 bytes, is 400 invalid_request
        and is not kept.

        Checks, in this order; the first that fails is the answer (component
        gateway-and-bot.md section 5.4): player_not_found; character_dead (also
        for abandoned); unknown_action; invalid_request (a target or a text the
        type does not take, or a missing one), text_invalid (say: 1..500
        characters after trim, no control characters), unknown_target (no
        entity has that id); for a group move no_leader, then not_leader (I2,
        C-04 v1.3); in_encounter (enter, leave, rest, group.join),
        not_in_encounter (attack, flee, defend), target_dead (attack),
        encounter_unavailable (the encounter has had no task agent for longer
        than MV_GATEWAY_ENCOUNTER_GRACE); not_in_region (leave outside every
        region), unknown_target (a region of another world, an NPC outside the
        encounter); already_acted (a round of a group scope, I2).

        The text of say goes through the input filter first (FR-056): the bus
        gets the text the filter returns; a failure of the filter is 422
        filter_error, a text it blocks is 400 text_invalid. enter and leave
        propose the position of the character only, rest proposes hp = hp_max
        (C-02, C-04 v1.2).

        Rate limit (SEC-11): MV_GATEWAY_RATE_ACTIONS_PER_MIN actions (30) in any
        minute and MV_GATEWAY_RATE_ACTIONS_BURST (5) in a row per player_id;
        over it, 429 rate_limited with Retry-After, before any other check and
        without keeping an answer. There is no limit in replay mode.
      x-idempotency: action_key
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/PlayerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: A group.* action whose fact arrived in time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupView' }
        '202':
          description: The action is accepted, or a group.* action is pending.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActionAccepted'
                  - $ref: '#/components/schemas/ActionPending'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/groups/{group_id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: State of a group
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/clients/{client_id}/deliveries:
    get:
      operationId: pollDeliveries
      tags: [deliveries]
      summary: Long-poll the outbox
      description: |
        One active long-poll per client (a second one answers 409
        poll_in_progress). Deliveries of one player come strictly in order, one
        at a time; without an ack a delivery is given again after 30 s.
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/ClientIdPath'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/WaitMs'
      responses:
        '200':
          description: Deliveries, possibly none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveriesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/clients/{client_id}/deliveries/ack:
    post:
      operationId: ackDeliveries
      tags: [deliveries]
      summary: Acknowledge deliveries
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/ClientIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckRequest' }
      responses:
        '200':
          description: Acknowledged and unknown ids.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/clients/{client_id}/stream:
    get:
      operationId: streamDeliveries
      tags: [deliveries]
      summary: Push stream of deliveries (reserved, E-H)
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/ClientIdPath'
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /v1/scopes/{scope_id}/rounds/close:
    post:
      operationId: closeRound
      tags: [service]
      summary: Close the open round explicitly
      description: Publishes round.closed with close_reason=explicit. ci only.
      x-actor-kind: [ci]
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/ScopeId'
      responses:
        '200':
          description: The closed round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundCloseResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/sessions:
    get:
      operationId: adminSessions
      tags: [service]
      summary: Active sessions (operator)
      x-actor-kind: [ci]
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      responses:
        '200':
          description: Active sessions without external identifiers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/admin/agents/{agent_id}/tick:
    post:
      operationId: adminTick
      tags: [admin]
      summary: Immediate tick of an agent (reserved)
      x-reserved: EPIC-003 T-239
      x-actor-kind: [ci]
      parameters:
        - $ref: '#/components/parameters/ActorKind'
        - $ref: '#/components/parameters/AgentId'
      responses:
        default:
          description: Reserved; the answer of core is specified by EPIC-003 T-239.

  /v1/admin/agents:
    get:
      operationId: adminAgents
      tags: [admin]
      summary: Active agents by level (reserved)
      x-reserved: EPIC-003 T-239
      x-actor-kind: [ci]
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      responses:
        default:
          description: Reserved; the answer of core is specified by EPIC-003 T-239.

  /v1/admin/llm/usage:
    get:
      operationId: adminLlmUsage
      tags: [admin]
      summary: LLM usage by phase, level and provider (reserved, Should)
      x-reserved: EPIC-003 T-239
      x-actor-kind: [ci]
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      responses:
        default:
          description: Reserved; the answer of core is specified by EPIC-003 T-239.

  /v1/admin/replay/clock:
    post:
      operationId: replayClock
      tags: [process]
      summary: Set the clock of the roots of a replay (--mode=replay only)
      description: |
        A route of the process, not of a context (C-01 v1.9): cmd/multiverse mounts it on the HTTP server of the
        process only in --mode=replay, and in live mode it does not exist (404). It is not in the admin section:
        admin is the proxy of the gateway to core, and that proxy does not pass this path. Access is that of the
        other /v1/admin/* routes of the process: X-Client-Id listed in MV_CORE_ADMIN_CLIENTS (ADR-009 p. 9, C-06).

        Before each input of a scenario the harness sends the time of that input; the process calls
        EventClock.Advance(at), which compares at with the time of the clock and moves the clock under one lock.
        NewRoot stamps the roots built afterwards, the player.* events the gateway publishes for the inputs, with
        that time. The harness calls the process that runs the gateway context, and waits for the answer to an
        input before the next call.

        at earlier than the clock is 409 clock_behind, and the clock does not move: it never goes back. at equal to
        the clock is 204. at missing or not RFC 3339 is 400. The roots of the inputs of a recording do not
        decrease; a decreasing one is a defect of the recording, which the harness reports before its first call.
      parameters:
        - $ref: '#/components/parameters/ActorKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                at: { type: string, format: date-time, description: 'The time of the next input, RFC 3339.' }
              required: [at]
      responses:
        '204':
          description: The clock is at the time of at.
        '400':
          description: invalid_body; at is missing or is not RFC 3339. The machine sign is code, message is a diagnostic in English; details are not sent (C-01 v1.11).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_body, message: 'replay: the body is not {"at": "<RFC 3339>"}' } }
        '403':
          description: X-Client-Id is not listed in MV_CORE_ADMIN_CLIENTS.
        '404':
          description: The process runs in live mode, where the route does not exist. Status only; the body is not specified.
        '405':
          description: A method other than POST. The mux of the process answers with Allow POST before the check of access, also without X-Client-Id; the body is not specified (C-01 v1.11).
        '409':
          description: clock_behind; at is earlier than the clock, and the clock did not move. The machine sign is code, message is a diagnostic in English (C-01 v1.11).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: clock_behind, message: 'replay: clock behind: 2026-09-13T12:00:00Z is before the clock at 2026-09-13T12:00:05Z' } }

  /health:
    get:
      operationId: health
      tags: [process]
      summary: Health of the process
      description: Served by the process HTTP server (shared/runtime, C-01 v1.7) for all contexts of the process; open, the port is bound to loopback.
      security: []
      responses:
        '200':
          description: ok or degraded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: fail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    ClientId:
      type: apiKey
      in: header
      name: X-Client-Id
      description: Client instance id; must be listed in MV_GATEWAY_CLIENT_IDS, otherwise 403 client_unknown (C-08 v1.3).

  parameters:
    ActorKind:
      name: X-Actor-Kind
      in: header
      required: false
      description: Kind of actor; ci and sim only for clients listed in MV_GATEWAY_ACTOR_KIND_CLIENTS, otherwise 403 actor_kind_forbidden.
      schema:
        type: string
        enum: [human, ci, sim]
        default: human
    PlayerId:
      name: player_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ClientIdPath:
      name: client_id
      in: path
      required: true
      description: Must equal X-Client-Id, otherwise 403 client_mismatch (SEC-12).
      schema: { type: string, minLength: 1 }
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    After:
      name: after
      in: query
      required: false
      description: Opaque cursor of the previous answer.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    WaitMs:
      name: wait_ms
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 25000, default: 25000 }

  headers:
    XRequestId:
      description: Request id (ULID), also in the log line of the request.
      schema: { type: string }
    RetryAfter:
      description: Seconds until the next action is accepted.
      schema: { type: integer, minimum: 1 }
    ForgetRetryAfter:
      description: Seconds before the caller repeats /forget; the busy timeout of the file of links, 5.
      schema: { type: integer, minimum: 1 }

  # x-error-codes lists the codes a response carries; every code of
  # internal/gateway/api/errors.go appears under the response of its status.
  responses:
    BadRequest:
      description: 'Request does not match the contract. Codes: invalid_request, unknown_action, text_invalid, name_required, name_invalid, consent_incomplete.'
      x-error-codes: [invalid_request, unknown_action, text_invalid, name_required, name_invalid, consent_incomplete]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_request, message: Некорректный запрос. } }
    Forbidden:
      description: 'Client or actor not allowed. Codes: consent_required, actor_kind_forbidden, client_unknown, client_mismatch.'
      x-error-codes: [consent_required, actor_kind_forbidden, client_unknown, client_mismatch]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: client_unknown, message: Клиент не допущен. } }
    NotFound:
      description: 'Codes: player_not_found, world_not_found, unknown_target.'
      x-error-codes: [player_not_found, world_not_found, unknown_target]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: player_not_found, message: Персонаж не найден. } }
    Conflict:
      description: |
        Precondition of the action does not hold. Codes: character_dead (also for
        abandoned), in_encounter, not_in_encounter, target_dead, no_leader
        (group move with leader_id null, checked before not_leader), not_leader,
        not_in_region, already_acted, no_open_round, poll_in_progress,
        already_in_group, not_in_group, group_full, group_in_encounter,
        encounter_unavailable, character_alive_exists (strict mode, not used).
      x-error-codes:
        - character_dead
        - in_encounter
        - not_in_encounter
        - target_dead
        - no_leader
        - not_leader
        - not_in_region
        - already_acted
        - no_open_round
        - poll_in_progress
        - already_in_group
        - not_in_group
        - group_full
        - group_in_encounter
        - encounter_unavailable
        - character_alive_exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: no_leader, message: У группы нет лидера. } }
    PayloadTooLarge:
      description: 'Body over 64 KiB (SEC-11). Codes: payload_too_large.'
      x-error-codes: [payload_too_large]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: payload_too_large, message: Слишком большой запрос. } }
    UnprocessableEntity:
      description: 'InputFilter failed, fail-closed (FR-056). Codes: filter_error.'
      x-error-codes: [filter_error]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: filter_error, message: Не удалось проверить текст. } }
    RateLimited:
      description: '30 actions per minute per player_id, burst 5 (SEC-11). Codes: rate_limited.'
      x-error-codes: [rate_limited]
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: rate_limited, message: 'Слишком много действий, подождите.' } }
    InternalError:
      description: 'Defect of the gateway (NFR-012). Codes: internal.'
      x-error-codes: [internal]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: internal, message: Внутренняя ошибка. } }
    NotImplemented:
      description: 'Reserved route (MVP-1: /stream). Codes: not_implemented.'
      x-error-codes: [not_implemented]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_implemented, message: Не реализовано. } }
    Unavailable:
      description: |
        A dependency is down; the action is not accepted and action_key is not stored, the client repeats with the same key.
        Codes: bus_unavailable, state_unavailable. The answer carries no Retry-After (C-08 v1.5).
      x-error-codes: [bus_unavailable, state_unavailable]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: bus_unavailable, message: 'Сервис временно недоступен, повторите.' } }
    ForgetIncomplete:
      description: |
        /forget only (forgetLink, adminForgetLink; C-08 v1.5). Codes: forget_incomplete. The link is deleted, but the
        wipe of its bytes from the file of links is not confirmed; the data must not be reported as gone. The caller
        repeats /forget not earlier than Retry-After; the reference client does not repeat it by itself.
      x-error-codes: [forget_incomplete]
      headers:
        Retry-After: { $ref: '#/components/headers/ForgetRetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: forget_incomplete, message: 'Удаление не завершено, повторите /forget.' } }

  schemas:
    Error:
      type: object
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
      required: [error]
    ErrorBody:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
      required: [code, message]

    ResolveRequest:
      type: object
      properties:
        external_platform: { type: string, enum: [telegram] }
        external_id: { type: string, minLength: 1 }
      required: [external_platform, external_id]
    ResolveResponse:
      type: object
      properties:
        link_status: { type: string, enum: [none, pending_consent, consented] }
        player_id: { type: [string, 'null'] }
        world_id: { type: [string, 'null'] }
        character_status: { type: string, enum: [none, creating, alive, dead] }
        notice_due: { type: boolean }
      required: [link_status, player_id, world_id, character_status, notice_due]
    ConsentRequest:
      type: object
      properties:
        external_platform: { type: string, enum: [telegram] }
        external_id: { type: string, minLength: 1 }
        notice_shown: { type: boolean }
        consent: { type: boolean }
        age_confirmed: { type: boolean }
        shown_at: { type: string, format: date-time }
      required: [external_platform, external_id, notice_shown, consent, age_confirmed, shown_at]
    ConsentResponse:
      type: object
      properties:
        link_status: { type: string, enum: [consented] }
        consent_at: { type: string, format: date-time }
        age_confirmed_at: { type: string, format: date-time }
        notice_shown_at: { type: string, format: date-time }
      required: [link_status, consent_at, age_confirmed_at, notice_shown_at]
    ForgetRequest:
      type: object
      properties:
        external_platform: { type: string, enum: [telegram] }
        external_id: { type: string, minLength: 1 }
      required: [external_platform, external_id]
    ForgetResponse:
      type: object
      properties:
        deleted: { type: boolean }
        player_id_detached: { type: [string, 'null'] }
      required: [deleted, player_id_detached]

    WorldsResponse:
      type: object
      properties:
        worlds:
          type: array
          items: { $ref: '#/components/schemas/WorldSummary' }
      required: [worlds]
    WorldSummary:
      type: object
      properties:
        world_id: { type: string }
        name: { type: string }
        regions:
          type: array
          items: { $ref: '#/components/schemas/RegionSummary' }
        laws_version: { type: string }
        llm: { $ref: '#/components/schemas/WorldLLM' }
      required: [world_id, name, regions, laws_version, llm]
    RegionSummary:
      type: object
      properties:
        region_id: { type: string }
        name: { type: string }
      required: [region_id, name]
    WorldLLM:
      type: object
      description: Only whether texts go to a cloud model; never a provider, URL or key (SEC-21).
      properties:
        cloud_enabled: { type: boolean }
      required: [cloud_enabled]

    CreateCharacterRequest:
      type: object
      properties:
        external_platform: { type: string, enum: [telegram] }
        external_id: { type: string, minLength: 1 }
        world_id: { type: string, minLength: 1 }
        character_name: { type: string }
        action_key: { type: string, minLength: 1, maxLength: 64 }
      required: [external_platform, external_id, world_id, character_name, action_key]
    CreateCharacterResponse:
      type: object
      properties:
        player_id: { type: string }
        character: { $ref: '#/components/schemas/CharacterState' }
        created: { type: boolean }
        status: { type: string, enum: [creating] }
      required: [player_id]

    CharacterState:
      type: object
      properties:
        player_id: { type: string }
        name: { type: string }
        world_id: { type: string }
        status: { type: string, enum: [creating, alive, dead, abandoned] }
        hp: { type: integer }
        hp_max: { type: integer }
        position: { $ref: '#/components/schemas/PositionRef' }
        scope: { $ref: '#/components/schemas/ScopeRef' }
        group: { $ref: '#/components/schemas/GroupView' }
        encounter: { $ref: '#/components/schemas/EncounterView' }
        inventory:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        world: { $ref: '#/components/schemas/WorldView' }
        session: { $ref: '#/components/schemas/SessionRef' }
        version: { type: integer }
      required: [player_id, name, world_id, status]
    PositionRef:
      type: object
      properties:
        kind: { type: string }
        id: { type: string }
        name: { type: string }
      required: [kind, id]
    ScopeRef:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [solo, group] }
      required: [id, type]
    GroupView:
      type: object
      properties:
        group_id: { type: string }
        leader_id:
          type: [string, 'null']
          description: null when no living member is left (C-08 v1.2, BR-13).
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        position: { $ref: '#/components/schemas/PositionRef' }
        encounter: { $ref: '#/components/schemas/EncounterView' }
        state: { type: string }
      required: [group_id, leader_id, members]
    GroupMember:
      type: object
      properties:
        player_id: { type: string }
        name: { type: string }
        participation: { type: string, enum: [active, idle] }
        status: { type: string, enum: [creating, alive, dead, abandoned] }
      required: [player_id, name, participation]
    EncounterView:
      type: object
      properties:
        encounter_id: { type: string }
        npcs:
          type: array
          items: { $ref: '#/components/schemas/NPCView' }
        my_state: { type: string }
        round_seq: { type: integer, minimum: 1 }
      required: [encounter_id, npcs]
    NPCView:
      type: object
      properties:
        npc_id: { type: string }
        name: { type: string }
        hp: { type: integer }
        hp_max: { type: integer }
        status: { type: string }
      required: [npc_id, name, hp, hp_max, status]
    Item:
      type: object
      properties:
        item_id: { type: string }
        kind: { type: string }
        name: { type: string }
      required: [item_id, kind, name]
    WorldView:
      type: object
      properties:
        weather: { type: string }
        time_of_day: { type: string }
        day: { type: integer }
    SessionRef:
      type: object
      properties:
        session_id: { type: string }
        turns_count: { type: integer, minimum: 0 }
      required: [session_id, turns_count]

    ActionRequest:
      type: object
      properties:
        action_key: { type: string, minLength: 1, maxLength: 64 }
        type:
          type: string
          enum: [enter, leave, look, attack, flee, rest, say, defend, group.create, group.join, group.leave]
        target:
          type: [string, 'null']
          description: region_id for enter, npc_id for attack, group_id for group.join.
        text:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: say only; 1..500 characters after trim, no control characters.
        client_ts: { type: [string, 'null'], format: date-time }
      required: [action_key, type]
    ActionAccepted:
      type: object
      properties:
        correlation_id: { type: string }
        turn: { $ref: '#/components/schemas/TurnRef' }
        status: { type: string, enum: [accepted] }
        acked_at: { type: string, format: date-time }
      required: [correlation_id, turn, status, acked_at]
    ActionPending:
      type: object
      properties:
        status: { type: string, enum: [pending] }
        group_id: { type: string }
        correlation_id: { type: string }
      required: [status, group_id, correlation_id]
    TurnRef:
      type: object
      properties:
        seq: { type: integer, minimum: 1 }
        session_id: { type: string }
        round_seq: { type: integer, minimum: 1 }
      required: [seq, session_id]

    Delivery:
      type: object
      properties:
        id: { type: string }
        player_id: { type: string }
        route: { $ref: '#/components/schemas/DeliveryRoute' }
        kind: { type: string, enum: [ack, mechanics, narrative, world_event, group, system] }
        correlation_id: { type: string }
        event_id: { type: string }
        round_seq: { type: integer, minimum: 1 }
        generated_by: { type: string, enum: [rules, llm, template] }
        fallback_reason: { type: string }
        narrative_event_id: { type: string }
        text: { type: string, description: Plain text without markup (SEC-10). }
        data: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
      required: [id, player_id, kind, correlation_id, event_id, generated_by, text, created_at]
    DeliveryRoute:
      type: object
      description: Given only to a client of the platform of the link (SEC-12).
      properties:
        external_platform: { type: string }
        external_id: { type: string }
      required: [external_platform, external_id]
    DeliveriesResponse:
      type: object
      properties:
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }
        cursor: { type: string }
      required: [deliveries, cursor]
    AckRequest:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
      required: [ids]
    AckResponse:
      type: object
      properties:
        acked: { type: integer, minimum: 0 }
        unknown:
          type: array
          items: { type: string }
      required: [acked, unknown]

    RoundCloseResponse:
      type: object
      properties:
        round: { $ref: '#/components/schemas/ClosedRound' }
      required: [round]
    ClosedRound:
      type: object
      properties:
        seq: { type: integer, minimum: 1 }
        close_reason: { type: string, enum: [all_acted, timeout, explicit] }
      required: [seq, close_reason]

    AdminSessions:
      type: object
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/AdminSession' }
      required: [sessions]
    AdminSession:
      type: object
      properties:
        session_id: { type: string }
        kind: { type: string, enum: [solo, group] }
        scope: { $ref: '#/components/schemas/ScopeRef' }
        world_id: { type: string }
        actor_kind: { type: string, enum: [human, ci, sim] }
        started_at: { type: string, format: date-time }
        turns_count: { type: integer, minimum: 0 }
      required: [session_id, kind, scope, world_id, actor_kind, started_at, turns_count]

    Health:
      type: object
      description: runtime.Status of the process (shared/runtime); details per context.
      properties:
        status: { type: string, enum: [ok, degraded, fail] }
        details: { type: object, additionalProperties: true }
      required: [status]
