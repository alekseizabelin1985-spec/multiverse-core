# golangci-lint configuration of the single module multiverse-core.io.
# Pinned version: GOLANGCI_LINT_VERSION in build/versions.env (v2.13.2).
#
# The depguard rules below encode the import boundaries of ADR-001 (p. 3 and
# addendum p. 2, 7): internal/<a> does not import internal/<b>, everything else
# talks over the bus. forbidigo keeps the whole of time (the clock, the timers
# and the durations derived from them) and the whole of the environment behind
# shared/clock and shared/env so that replay stays deterministic.
version: "2"

run:
  build-tags:
    - integration
    - e2e

# Report every finding: a truncated report hides regressions in review.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # Every rule below is fail-closed: list-mode "lax" plus a deny of the
        # whole multiverse-core.io/internal prefix means "nothing but what the
        # allow list names" for contexts, while the standard library, shared/*
        # and third-party modules stay open (ADR-001 p. 3, addendum p. 2, 7).

        # shared/* is a library layer: it must not reach into a context.
        shared:
          files:
            - "**/shared/**"
            - "!**/shared/testkit/mechanics/**"
            - "!**/shared/testkit/state/**"
            - "!**/shared/testkit/swarm/**"
            - "!**/shared/testkit/gateway/**"
          deny:
            - pkg: multiverse-core.io/internal
              desc: "shared/* must not import internal/*; a context depends on shared, never the other way round (ADR-001 p. 3)"

        # The one exception, and the reason it does not weaken the boundary: a
        # test double is coupled to what it doubles by definition. FixedMechanics
        # has to speak the types of C-03 (Outcome, Roll, Actor, Action) or it and
        # *mechanics.Rules cannot satisfy one interface, which is the whole point
        # of the double. The exception names one directory and one package: the
        # double of mechanics may see mechanics and nothing else. The trailing $
        # is what makes it one package: depguard matches allow entries by
        # prefix, so without it internal/mechanicsx or internal/mechanics/any
        # would pass as well (the hole review #1 of T-410, Mi-3, closed for
        # membus; T-415).
        shared-testkit-mechanics:
          list-mode: lax
          files:
            - "**/shared/testkit/mechanics/**"
          allow:
            - multiverse-core.io/internal/mechanics$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "the mechanics double may see internal/mechanics and no other context (ADR-001 p. 3, exception recorded in journal.md 2026-09-10)"

        # The double of State is State itself: FakeState is state.Applier over
        # memstore without the object store (state-and-mechanics.md §8, C-02
        # "Заглушка"; T-056), so that a consumer tested against the double is
        # tested against the decisions of the real pipeline. It may see the
        # Applier, its working set and the laws WithInvariants turns on, and no
        # other context. Each entry is one package, with the trailing $ for the
        # reason given at shared-testkit-mechanics. It is the fourth exception
        # of shared/testkit: ADR-001 (addendum 2026-09-13, conditions of review)
        # suggests moving the doubles into internal/<ctx>/<ctx>test past three,
        # which is the question T-056 leaves to system-architect.
        shared-testkit-state:
          list-mode: lax
          files:
            - "**/shared/testkit/state/**"
          allow:
            - multiverse-core.io/internal/state$
            - multiverse-core.io/internal/state/memstore$
            - multiverse-core.io/internal/mechanics$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "the double of State may see internal/state, internal/state/memstore and internal/mechanics and no other context (state-and-mechanics.md §8, T-056)"

        # Test doubles stay in tests. ownership.md §1 already treats one file as
        # "the only import of shared/testkit in the production binary", but the
        # ban itself was never written down, and the exception for the mechanics
        # double above opens a way round the boundary: a context could reach
        # internal/mechanics through the double instead of directly. The pair
        # "rule here, exclusion for _test.go below" is how shared/(clock|env)
        # and forbidigo already say "in these files and nowhere else".
        #
        # The transport of --bus=memory is not an exception: membus is the
        # second implementation of C-01 and lives in shared/eventbus/membus,
        # next to the kafka adapter (T-418, ADR-001 addendum 2026-09-11).
        # That makes shared/eventbus/** code of the binary too, so it is under
        # the ban: an import of testkit there would reach the binary silently.
        #
        # internal/gateway/gatewaytest is a double of the same kind that lives
        # next to what it doubles (FakeGateway, ADR-001 addendum, boundary 1e),
        # so it is banned from shipped code on the same terms.
        #
        # shared/recording is code of the binary as well: shared/runtime imports
        # it for Deps.Recording, so a double imported there would ship (C-01
        # v1.9, T-458).
        no-testkit-in-production:
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "**/shared/eventbus/**"
            - "**/shared/recording/**"
            - "!**/cmd/multiverse/fake_contexts.go"
          deny:
            - pkg: multiverse-core.io/shared/testkit
              desc: "shared/testkit is for tests: production code (internal/*, cmd/*, shared/eventbus/* including membus, shared/recording/*) must not import a double (ADR-001 p. 3). The one exception is cmd/multiverse/fake_contexts.go (testkit/swarm, the hook of I1-α, T-255; removed by T-256)"
            - pkg: multiverse-core.io/internal/gateway/gatewaytest
              desc: "internal/gateway/gatewaytest (FakeGateway) is for tests: production code (internal/*, cmd/*, shared/eventbus/*, shared/recording/*) must not import it (ADR-001 addendum, boundary 1e)"

        # The hook of I1-α: one file, one package, and the trailing $ so that
        # swarmx or swarm/anything does not pass by prefix (depguard matches
        # allow entries by prefix, review #1 of T-410, Mi-3).
        # MV_SWARM_FAKE=true mounts FakeEncounter and FakeNarrator under the
        # name swarm (ADR-001 addendum p. 8, T-255);
        # without the rule the exclusion of no-testkit-in-production would let
        # this file import any double at all. Rule, exclusion and file leave
        # together in T-256 (criterion of the mvp-1/i1 tag).
        cmd-multiverse-fake-contexts:
          list-mode: lax
          files:
            - "**/cmd/multiverse/fake_contexts.go"
          allow:
            - multiverse-core.io/shared/testkit/swarm$
          deny:
            - pkg: multiverse-core.io/shared/testkit
              desc: "fake_contexts.go may import shared/testkit/swarm, the stub of I1-α, and nothing else of shared/testkit (T-255; removed by T-256)"
            # The file is excluded from no-testkit-in-production as a whole,
            # so the ban on the gateway double is repeated here.
            - pkg: multiverse-core.io/internal/gateway/gatewaytest
              desc: "fake_contexts.go is shipped code: it must not import internal/gateway/gatewaytest (FakeGateway, ADR-001 addendum, boundary 1e)"

        # The combat double, for the same reason and on the same terms as the
        # mechanics double above: FakeEncounter resolves a fight, so it has to
        # speak Action, Actor, Outcome and Roll of C-03 — otherwise it and the
        # real *mechanics.Rules stop satisfying one interface and the double
        # stops being a double. Named rule rather than //nolint on the import:
        # a directive lives out of sight of this file and gets copied by the
        # next author who does not know why it was there (T-219). The trailing $
        # keeps it to that one package, as for the mechanics double (T-415).
        shared-testkit-swarm:
          list-mode: lax
          files:
            - "**/shared/testkit/swarm/**"
          allow:
            - multiverse-core.io/internal/mechanics$
            - multiverse-core.io/internal/swarm/template$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "the combat double may see internal/mechanics and internal/swarm/template and no other context (ADR-001 p. 3, addendum boundary 1d)"

        # The gateway double drives the real client against the wire types of
        # C-10 (ADR-001 addendum, boundary 1e): it speaks internal/gateway/api
        # and uses internal/gateway/client, one package each, with the trailing
        # $ for the reason given at shared-testkit-mechanics. The rule shared
        # does not apply here, this one does instead.
        shared-testkit-gateway:
          list-mode: lax
          files:
            - "**/shared/testkit/gateway/**"
          allow:
            - multiverse-core.io/internal/gateway/client$
            - multiverse-core.io/internal/gateway/api$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "the gateway double may see internal/gateway/client and internal/gateway/api and no other package of internal/* (ADR-001 addendum, boundary 1e)"

        # The trap for contexts that have no rule of their own yet: without it a
        # new internal/<ctx> would inherit no boundary at all and could import
        # anything. Adding a context means adding both its negation here and its
        # own allow rule below.
        internal-unlisted:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/state/**"
            - "!**/internal/mechanics/**"
            - "!**/internal/swarm/**"
            - "!**/internal/llm/**"
            - "!**/internal/laws/**"
            - "!**/internal/gateway/**"
            - "!**/internal/memory/**"
            - "!**/internal/replay/**"
            # Not a context: the bot's own internal/ has its rule cmd-telegram-bot.
            - "!**/cmd/telegram-bot/**"
            # Not a context: mvctl world has its rule cmd-mvctl-world.
            - "!**/cmd/mvctl/internal/world/**"
          deny:
            - pkg: multiverse-core.io/internal
              desc: "this context has no depguard rule yet: declare its allowed neighbours in .golangci.yml before importing internal/* (ADR-001 p. 3)"

        # state owns the world and uses mechanics as a pure library. The
        # neighbour is named with a trailing $, like the doubles above: depguard
        # matches allow entries by prefix, and internal/mechanicsx must not pass
        # as mechanics. A subpackage a context needs is added as a second entry
        # (…/mechanics/) on purpose (review #1 of T-415, N-4).
        #
        # A context names its own package the same way, as two entries: <ctx>$
        # and <ctx>/. A bare prefix let internal/statex pass as state (review #1
        # of T-445, Mi-2). depguard compares an import with the nearest entry
        # below it in sort order only, so a prefix entry and a narrower $ entry
        # under the same prefix in one list shadow each other: keep them apart.
        internal-state:
          list-mode: lax
          files:
            - "**/internal/state/**"
          allow:
            - multiverse-core.io/internal/state$
            - multiverse-core.io/internal/state/
            - multiverse-core.io/internal/mechanics$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "state uses mechanics as a library and talks to every other context over the bus (ADR-001 p. 3)"

        # mechanics is a pure library: it depends on no context, not even state.
        internal-mechanics:
          list-mode: lax
          files:
            - "**/internal/mechanics/**"
          allow:
            - multiverse-core.io/internal/mechanics$
            - multiverse-core.io/internal/mechanics/
          deny:
            - pkg: multiverse-core.io/internal
              desc: "mechanics is a pure library: contexts depend on it, not the other way round (ADR-001 addendum p. 2)"

        # swarm is the only context allowed to use mechanics, laws and llm as
        # libraries — each of them one package, with the trailing $ for the
        # reason given at internal-state. Of llm it sees the root, prompt and
        # guardian (ADR-001 addendum, boundary 1c); parser is not among them —
        # the swarm names a schema by a string. filter and the providers stay
        # behind the gateway of llm.
        internal-swarm:
          list-mode: lax
          files:
            - "**/internal/swarm/**"
            - "!**/internal/swarm/**_test.go"
          allow:
            - multiverse-core.io/internal/swarm$
            - multiverse-core.io/internal/swarm/
            - multiverse-core.io/internal/mechanics$
            - multiverse-core.io/internal/laws$
            - multiverse-core.io/internal/llm$
            - multiverse-core.io/internal/llm/prompt$
            - multiverse-core.io/internal/llm/guardian$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "swarm uses mechanics, laws, llm, llm/prompt and llm/guardian as libraries; it changes the world by proposing entity operations over the bus (C-02, ADR-001 p. 3, addendum boundary 1c)"

        # The tests of swarm see what its shipped code sees plus the fake
        # provider of llm, one package. The pair production rule / test rule
        # is written as two rules on purpose: depguard sees files, not build
        # kinds, and an exclusion by text would open every _test.go of swarm to
        # any package whose name merely contains the one allowed.
        internal-swarm-tests:
          list-mode: lax
          files:
            - "**/internal/swarm/**_test.go"
          allow:
            - multiverse-core.io/internal/swarm$
            - multiverse-core.io/internal/swarm/
            - multiverse-core.io/internal/mechanics$
            - multiverse-core.io/internal/laws$
            - multiverse-core.io/internal/llm$
            - multiverse-core.io/internal/llm/prompt$
            - multiverse-core.io/internal/llm/guardian$
            - multiverse-core.io/internal/llm/providers/fake$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "tests of swarm may add internal/llm/providers/fake to what swarm itself sees, and nothing else (ADR-001 addendum, boundary 1c)"

        # template is a leaf (ADR-001 addendum, boundary 1d): the combat double
        # of shared/testkit may import it, and a template that imported a
        # context would hand the double that context through the back door.
        # The package itself is allowed for its external tests.
        internal-swarm-template:
          list-mode: lax
          files:
            - "**/internal/swarm/template/**"
          allow:
            - multiverse-core.io/internal/swarm/template$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "internal/swarm/template is a leaf package: it imports no internal/* (ADR-001 addendum, boundary 1d)"

        internal-llm:
          list-mode: lax
          files:
            - "**/internal/llm/**"
          allow:
            - multiverse-core.io/internal/llm$
            - multiverse-core.io/internal/llm/
          deny:
            - pkg: multiverse-core.io/internal
              desc: "llm is a library of swarm and memory, not the other way round (ADR-001 p. 3)"

        internal-laws:
          list-mode: lax
          files:
            - "**/internal/laws/**"
          allow:
            - multiverse-core.io/internal/laws$
            - multiverse-core.io/internal/laws/
          deny:
            - pkg: multiverse-core.io/internal
              desc: "laws is a library of swarm, not the other way round (ADR-001 p. 3)"

        internal-gateway:
          list-mode: lax
          files:
            - "**/internal/gateway/**"
          allow:
            - multiverse-core.io/internal/gateway$
            - multiverse-core.io/internal/gateway/
          deny:
            - pkg: multiverse-core.io/internal
              desc: "gateway publishes player events on the bus and reaches memory over HTTP (C-04, C-10)"

        # The client of C-10 is a leaf over the wire types (ADR-001 addendum,
        # boundary 1e): the gateway double of shared/testkit imports it, so it
        # must not bring the rest of the gateway along. The package itself is
        # allowed for its external tests.
        internal-gateway-client:
          list-mode: lax
          files:
            - "**/internal/gateway/client/**"
          allow:
            - multiverse-core.io/internal/gateway/client$
            - multiverse-core.io/internal/gateway/api$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "internal/gateway/client imports internal/gateway/api and no other package of internal/* (ADR-001 addendum, boundary 1e)"

        # memory may use llm for embeddings only: the root package (Provider,
        # Request, Response) and providers.Registry (ADR-001 addendum p. 7).
        # providers is one package with the trailing $: without it
        # providers/openai_compat and providers/fake passed by prefix. The fake
        # provider is for the tests of memory, in the rule below.
        internal-memory:
          list-mode: lax
          files:
            - "**/internal/memory/**"
            - "!**/internal/memory/**_test.go"
          allow:
            - multiverse-core.io/internal/memory$
            - multiverse-core.io/internal/memory/
            - multiverse-core.io/internal/llm$
            - multiverse-core.io/internal/llm/providers$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "memory indexes the bus and may use only llm.Provider/Request/Response and providers.Registry (ADR-001 addendum p. 7)"

        internal-memory-tests:
          list-mode: lax
          files:
            - "**/internal/memory/**_test.go"
          allow:
            - multiverse-core.io/internal/memory$
            - multiverse-core.io/internal/memory/
            - multiverse-core.io/internal/llm$
            - multiverse-core.io/internal/llm/providers$
            - multiverse-core.io/internal/llm/providers/fake$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "tests of memory may add internal/llm/providers/fake to what memory itself sees, and nothing else (ADR-001 addendum p. 7, boundary 1c)"

        internal-replay:
          list-mode: lax
          files:
            - "**/internal/replay/**"
          allow:
            - multiverse-core.io/internal/replay$
            - multiverse-core.io/internal/replay/
          deny:
            - pkg: multiverse-core.io/internal
              desc: "replay drives the process through shared/runtime.Deps (ADR-001 addendum p. 2)"

        # The Telegram bot is a thin client of the gateway (ADR-018; component
        # gateway-and-bot §3; ADR-001 addendum, boundary 1e). Of internal/* it
        # sees the client of C-10 and its wire types, one package each, with
        # the trailing $ for the reason given at shared-testkit-mechanics:
        # internal/gateway/links, store or the gateway itself must not pass by
        # prefix. It does not touch the bus, membus included: the bot is a
        # process of its own and reaches the platform over HTTP of the gateway
        # only. Its own packages live in cmd/telegram-bot/internal, outside
        # internal/* of the module, so they need no <ctx>$ + <ctx>/ pair.
        # internal-unlisted excludes the bot: its **/internal/** would
        # otherwise match cmd/telegram-bot/internal and deny the two packages
        # allowed here. The rule holds for the tests of the bot as well; a
        # test that needs internal/gateway/gatewaytest or membus gets a rule
        # of its own, like internal-swarm-tests. no-testkit-in-production and
        # cmd-others still apply to the bot.
        cmd-telegram-bot:
          list-mode: lax
          files:
            - "**/cmd/telegram-bot/**"
          allow:
            - multiverse-core.io/internal/gateway/client$
            - multiverse-core.io/internal/gateway/api$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "cmd/telegram-bot may import internal/gateway/client and internal/gateway/api and no other package of internal/*: the bot talks to the platform over HTTP of C-10 only (ADR-018, ADR-001 addendum, boundary 1e)"
            - pkg: multiverse-core.io/shared/eventbus
              desc: "cmd/telegram-bot does not touch the bus, membus included: commands and deliveries go through the gateway over HTTP (ADR-018, component gateway-and-bot §3)"

        # mvctl world creates a world through State and nothing else
        # (state-and-mechanics.md §4.10, T-058): with --bus memory it runs
        # internal/state inside the command and holds it to the laws of the rule
        # book, which internal/mechanics loads. Each neighbour is one package,
        # with the trailing $ for the reason given at shared-testkit-mechanics.
        # internal-unlisted excludes the command: its **/internal/** would
        # otherwise match cmd/mvctl/internal/world and deny the two packages
        # allowed here. The rule holds for its tests as well.
        cmd-mvctl-world:
          list-mode: lax
          files:
            - "**/cmd/mvctl/internal/world/**"
          allow:
            - multiverse-core.io/internal/state$
            - multiverse-core.io/internal/mechanics$
          deny:
            - pkg: multiverse-core.io/internal
              desc: "mvctl world may import internal/state and internal/mechanics and no other package of internal/*: it creates a world through State (state-and-mechanics.md §4.10, T-058)"

        # cmd/multiverse is the only importer of internal/replay.
        cmd-others:
          files:
            - "**/cmd/mvctl/**"
            - "**/cmd/telegram-bot/**"
          deny:
            - pkg: multiverse-core.io/internal/replay
              desc: "only cmd/multiverse imports internal/replay (ADR-001 addendum p. 2)"

    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          msg: read configuration through shared/env so that it appears in the manifest and in .env.example (NFR-074)
        - pattern: ^time\.Now$
          msg: take the time from shared/clock.Clock, otherwise replay is not reproducible (ADR-001 addendum p. 2)
        - pattern: ^time\.(After|Tick|NewTimer|NewTicker|Since|Until)$
          msg: take timers and durations from shared/clock.Timers, otherwise replay runs at wall-clock speed and is not reproducible (ADR-001 addendum p. 2)
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: log through log/slog (shared/logging), the platform emits JSON only

  exclusions:
    generated: lax
    paths:
      # Not part of the module: archived code (U-1) and the frozen services keep
      # their own go.mod and are never built, linted or shipped.
      - services/_archive
      - services/
    rules:
      # The owners of time and the environment, and only they: shared/clock
      # implements the time interfaces and shared/env is the only reader of the
      # environment (F-5, T-007 moved the last os.LookupEnv of shared/runtime
      # onto the manifest). Every other shared/* package is subject to the ban
      # like a context is (foundation.md §4, §8).
      - path: shared/(clock|env)/
        linters:
          - forbidigo
        text: (os\.(Getenv|LookupEnv|Environ|ExpandEnv)|time\.(Now|After|Tick|NewTimer|NewTicker|Since|Until))

      # The other half of no-testkit-in-production: a test may use the doubles,
      # a shipped file may not. depguard sees files, not build kinds, so the
      # kind is said here.
      #
      # The text names the list, and only that ban is lifted: the rules of the
      # contexts and of shared still hold in tests. gatewaytest itself lives in
      # internal/, so an exclusion by package name alone would let the test of
      # any context, or of shared, import it past its own boundary (ADR-001
      # addendum, boundary 1e; review #1 of T-445, Ma-1). gatewaytest is one
      # package, anchored by the quote that closes the import in the message;
      # shared/testkit keeps its subpackages.
      - path: _test\.go$
        linters:
          - depguard
        text: "^import 'multiverse-core[.]io/(shared/testkit(/[^']*)?|internal/gateway/gatewaytest)' is not allowed from list 'no-testkit-in-production'"

      # Code carried over unchanged when the workspace became one module
      # (T-003, foundation.md §11). Formatting is enforced everywhere; the
      # historic semantic findings of these packages are deferred to the task
      # that rewrites them, and the entry goes away with that rewrite.
      #
      # shared/eventbus is no longer listed: F-4a (T-005) rewrote it, and its
      # time now comes from shared/clock through eventbus.SetClock.
      # shared/agent is no longer listed either: T-201 (EPIC-003) moved the
      # as-is agent runtime to services/_archive/shared/agent, wrote the
      # blueprint v2 types and parser, and gave lod.go and tools/registry.go
      # their time through shared/clock.Clock/Timers taken as constructor
      # arguments.
      # shared/entity is no longer listed either: F-10 (T-011) rewrote it as the
      # model v2, which has no clock at all — every timestamp of an entity is
      # the timestamp of the event that caused it (ADR-003 p. 6).
      # Demo programs kept next to the packages they document; F-9 (T-019)
      # decides whether they stay.
      - path: shared/[a-z]+/examples/
        linters:
          - forbidigo
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - multiverse-core.io
  exclusions:
    paths:
      - services/_archive
      - services/
      # Не исходники проекта, а рабочие копии рядом с ним: `.claude/worktrees`
      # держит старое дерево на 135 файлов, `build/.legacy-src` — выгрузку
      # замороженных сервисов из закреплённого коммита (цель legacy-src). Обе
      # попадают под обход `./...`, обе форматировались хуком — и его правки
      # срывали коммит, потому что файлы не отслеживаются. Формат чужой копии
      # менять нельзя: у неё своя история (2026-09-11).
      - .claude/
      - build/.legacy-src
