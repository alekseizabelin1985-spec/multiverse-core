<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dev-team · dashboard</title>
<style>
:root{color-scheme:light;
 --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
 --s1:#2a78d6;--s1-soft:#cde2fb;--s2:#eb6834;--s3:#1baf7a;--s7:#4a3aa7;
 --done:#1c5cab;--review:#2a78d6;--prog:#6da7ec;--todo:#e1e0d9;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--good-text:#006300;
 --radius:12px;--shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px -16px rgba(11,11,11,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
 --s1:#3987e5;--s1-soft:#184f95;--s2:#d95926;--s3:#199e70;--s7:#9085e9;
 --done:#9ec5f4;--review:#5598e7;--prog:#256abf;--todo:#383835;--good-text:#0ca30c;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
 --s1:#3987e5;--s1-soft:#184f95;--s2:#d95926;--s3:#199e70;--s7:#9085e9;
 --done:#9ec5f4;--review:#5598e7;--prog:#256abf;--todo:#383835;--good-text:#0ca30c;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 44px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.01em}
.top h1 span{color:var(--muted);font-weight:500}
.top .sub{color:var(--ink2);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.top .spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);padding:5px 10px;border:1px solid var(--ring);border-radius:999px;background:var(--surface)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on{color:var(--good-text)}.live.on i{background:var(--good);animation:pulse 1.6s infinite}
.live.finished{color:var(--s1)}.live.finished i{background:var(--s1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.45)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
button.tgl{font:inherit;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:5px 11px;cursor:pointer}
button.tgl:hover{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:650;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:5px}
.kpi .v.warn{color:var(--serious)}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.kpi .sub .s-crit{color:var(--crit);font-weight:600}.kpi .sub .s-serious{color:var(--serious);font-weight:600}
.prog{height:6px;background:var(--todo);border-radius:4px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--s1);border-radius:4px;transition:width .4s}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
section.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
section.card>header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px}
section.card h2{margin:0;font-size:15px;font-weight:650}
.hint{color:var(--muted);font-size:12px}
.sp{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters button{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--ring);background:transparent;color:var(--ink2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.filters label{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;margin-left:6px}
.empty{color:var(--muted);margin:6px 0}
/* now */
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.act{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--s1);border-radius:10px;background:color-mix(in srgb,var(--s1) 6%,var(--surface))}
.act .avatar{width:36px;height:36px;border-radius:50%;background:var(--s1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.act .who{font-weight:600;font-size:13px}
.act .what{font-size:12px;color:var(--ink2)}
.act .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--s1);font-weight:600}
/* initiatives */
.ini{border-top:1px solid var(--grid);padding:12px 0}
.ini:first-child{border-top:0;padding-top:2px}
.ini header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ini .iid{font-variant-numeric:tabular-nums}
.ini .ititle{color:var(--ink2)}
.ini .stage-now{margin-left:auto;font-size:12px;color:var(--s1);font-weight:600;display:flex;gap:8px;align-items:center}
.ini .stage-now .t{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ini.done .stage-now{color:var(--good-text)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--ring);color:var(--ink2);white-space:nowrap}
.chip.t-feature{border-color:var(--s1);color:var(--s1)}.chip.t-bug{border-color:var(--s2);color:var(--s2)}.chip.t-project{border-color:var(--s7);color:var(--s7)}.chip.t-epic{border-color:var(--s3);color:var(--s3)}
.chip.size{background:var(--grid);border-color:transparent}
.chip.team{background:color-mix(in srgb,var(--s3) 12%,transparent);border-color:transparent;color:var(--ink2)}
.chip.on{border-color:var(--s1);color:var(--s1)}
.ini.child{padding-left:18px;border-left:3px solid color-mix(in srgb,var(--s3) 35%,transparent)}
/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.teamcard{border:1px solid var(--grid);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.teamcard.done{opacity:.7}
.teamcard header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teamcard header strong{font-size:14px}
.teamcard .stage-now{margin-left:auto;font-size:12px;color:var(--s1);font-weight:600}
.teamcard .meta code{font-size:11px;color:var(--muted)}
.teamcard .members{display:flex;flex-wrap:wrap;gap:4px}
.teamcard .tprog{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.teamcard .tprog .prog{margin:0}
.teamcard .tnow{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.role .avatar{position:relative}
.role .cnt{position:absolute;right:-6px;top:-6px;font-size:9px;background:var(--s2);color:#fff;border-radius:999px;padding:1px 4px;line-height:1.2}
.pipe{list-style:none;margin:10px 0 0;padding:0;display:flex;align-items:flex-start;overflow-x:auto}
.pipe li{position:relative;display:flex;flex-direction:column;align-items:center;min-width:60px;flex:1;font-size:11px;color:var(--muted)}
.pipe li.gate{min-width:34px;flex:0 0 34px}
.pipe li::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--grid);z-index:0}
.pipe li:first-child::before{left:50%}.pipe li:last-child::before{right:50%}
.pipe .dot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--axis)}
.pipe .st-done .dot{background:var(--s1);border-color:var(--s1)}
.pipe .st-done::before{background:var(--s1)}
.pipe .st-cur .dot{background:var(--surface);border-color:var(--s1);box-shadow:0 0 0 4px var(--s1-soft)}
.pipe .st-cur .lbl{color:var(--ink);font-weight:600}
.pipe .st-done .lbl{color:var(--ink2)}
.pipe .lbl,.pipe .glbl{margin-top:6px;white-space:nowrap}
.pipe .dia{position:relative;z-index:1;width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:var(--surface);border:2px solid var(--axis);display:flex;align-items:center;justify-content:center}
.pipe .dia svg{transform:rotate(-45deg);width:11px;height:11px}
.pipe .g-ok .dia{background:var(--good);border-color:var(--good);color:#fff}
.pipe .g-warn .dia{background:var(--warn);border-color:var(--warn);color:#0b0b0b}
.pipe .g-crit .dia{background:var(--crit);border-color:var(--crit);color:#fff}
.pipe .g-na .dia{background:var(--grid);border-color:var(--grid);color:var(--muted)}
.pipe .g-ok::before,.pipe .g-na::before{background:var(--s1)}
.pipe .glbl{font-weight:600}
.pipe .g-warn .glbl,.pipe .g-crit .glbl{color:var(--ink)}
.ini .next{margin:8px 0 0;font-size:12px;color:var(--ink2)}
.ini .next span{color:var(--muted)}
.ini .tasklist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.ini .tasklist li{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--grid);color:var(--ink2);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.ini .tasklist li i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ini .tasklist li.done{opacity:.75}.ini .tasklist li.in-progress{border-color:var(--s1);color:var(--ink)}
.ini .tasklist li .spent{color:var(--muted)}
/* tasks */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:8px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.todo,.seg.todo,.tasklist i.todo{background:var(--todo)}
.sw.in-progress,.seg.in-progress,.tasklist i.in-progress{background:var(--prog)}
.sw.review,.seg.review,.tasklist i.review{background:var(--review)}
.sw.done,.seg.done,.tasklist i.done{background:var(--done)}
.bar-row{display:grid;grid-template-columns:minmax(140px,220px) 1fr 52px;align-items:center;gap:10px;padding:5px 0}
.bar-lbl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-lbl em{font-style:normal;color:var(--ink2)}
.bar{display:flex;gap:2px;height:18px}
.seg{display:flex;align-items:center;justify-content:center;border-radius:3px;min-width:4px;transition:width .4s,filter .15s}
.seg:first-child{border-radius:4px 3px 3px 4px}.seg:last-child{border-radius:3px 4px 4px 3px}
.seg b{font-size:11px;font-weight:600;color:var(--ink)}
.seg.done b,.seg.review b{color:#fff}
:root[data-theme="dark"] .seg.done b,:root[data-theme="dark"] .seg.review b{color:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.done b,:root:not([data-theme="light"]) .seg.review b{color:#0b0b0b}}
.seg:hover{filter:brightness(1.12)}
.bar-val{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
/* defects */
.def-total{font-size:28px;font-weight:650;margin:-2px 0 6px}
.def-row{display:grid;grid-template-columns:92px 1fr 28px;align-items:center;gap:10px;padding:4px 0;font-size:12px}
.def-lbl{display:flex;align-items:center;gap:6px;font-weight:600}
.s-crit{color:var(--crit)}.s-serious{color:var(--serious)}.s-warn{color:var(--warn)}.s-ok{color:var(--good-text)}
.def-bar{height:10px;background:var(--todo);border-radius:4px;overflow:hidden}
.def-fill{display:block;height:100%;border-radius:4px;transition:width .4s}
.def-fill.s-crit{background:var(--crit)}.def-fill.s-serious{background:var(--serious)}.def-fill.s-warn{background:var(--warn)}
.def-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--grid)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.gcell{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.gcell.g-ok{color:var(--good-text)}.gcell.g-warn{color:var(--serious)}.gcell.g-crit{color:var(--crit)}.gcell.g-na,.gcell.g-ahead{color:var(--muted)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.role{display:grid;grid-template-columns:32px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--grid)}
.role .avatar{grid-row:1/3;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--grid);color:var(--ink2)}
.role .rname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role .rstate{font-size:11px;color:var(--muted)}
.role.r-active{border-color:var(--s1)}.role.r-active .avatar{background:var(--s1);color:#fff}.role.r-active .rstate{color:var(--s1);font-weight:600}
.role.r-done .avatar{background:var(--s1-soft);color:var(--ink)}
.role.r-idle{opacity:.7}
/* timeline */
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--grid);max-height:520px;overflow:auto}
.timeline li{position:relative;padding:3px 0 9px 14px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.timeline li::before{content:"";position:absolute;left:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--axis);border:2px solid var(--surface)}
.timeline li.tl-ok::before{background:var(--good)}.timeline li.tl-warn::before{background:var(--warn)}.timeline li.tl-crit::before{background:var(--crit)}
.timeline time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:96px}
.timeline .role{display:inline;padding:0;border:0;font-size:12px;color:var(--s1);font-weight:600}
.timeline .tl-text{color:var(--ink2);flex:1 1 55%}
.blockers{margin:0;padding-left:18px;color:var(--ink2)}.blockers li{margin:4px 0}
/* clickable */
[data-open]{cursor:pointer}
[data-open]:hover{outline:1px solid var(--s1);outline-offset:2px;border-radius:6px}
.ini header[data-open]:hover,.tl-text[data-open]:hover{outline:none;text-decoration:underline;text-decoration-color:var(--s1)}
/* docs */
.docs{display:flex;flex-wrap:wrap;gap:6px}
.docs .chip{padding:5px 10px;font-size:12px}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:var(--surface);border-left:1px solid var(--ring);box-shadow:-12px 0 32px -16px rgba(0,0,0,.4);z-index:41;display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--grid)}
.drawer-head h3{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-head .tgl{flex:none}
.drawer-body{padding:14px 18px 28px;overflow:auto;flex:1}
.drawer-body h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.drawer-body h4:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--page);border:1px solid var(--grid);border-radius:8px;padding:8px 12px;min-width:90px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:12px}
.crumbs .chip{cursor:pointer}
/* gantt */
.gantt{position:relative;font-size:12px}
.gantt .axis{position:relative;height:18px;border-bottom:1px solid var(--grid);margin-left:170px;color:var(--muted);font-size:11px}
.gantt .axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.gantt .grow{display:grid;grid-template-columns:170px 1fr;align-items:center;height:26px}
.gantt .glbl{padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .glbl b{font-variant-numeric:tabular-nums;margin-right:4px}
.gantt .glane{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),var(--grid) calc(10% - 1px),var(--grid) 10%)}
.gantt .gbar{position:absolute;top:6px;height:14px;border-radius:4px;min-width:3px;display:flex;align-items:center;padding:0 5px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden}
.gantt .gbar.done{background:var(--done)}.gantt .gbar.review{background:var(--review)}.gantt .gbar.in-progress{background:var(--prog);color:var(--ink)}.gantt .gbar.todo{background:var(--todo);color:var(--ink2)}
:root[data-theme="dark"] .gantt .gbar.done,:root[data-theme="dark"] .gantt .gbar.review{color:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gantt .gbar.done,:root:not([data-theme="light"]) .gantt .gbar.review{color:#0b0b0b}}
.gantt .now{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--s2);margin-left:170px;z-index:2;pointer-events:none}
.gantt .wave{grid-column:1/-1;font-size:11px;color:var(--muted);padding:6px 0 2px;border-top:1px dashed var(--grid)}
/* markdown */
.md{font-size:13px;line-height:1.55}
.md h1{font-size:18px;margin:14px 0 8px}.md h2{font-size:15px;margin:14px 0 6px}.md h3{font-size:13px;margin:12px 0 4px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;font-size:12px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--grid);padding:4px 8px;text-align:left;vertical-align:top}
.md pre{background:var(--page);border:1px solid var(--grid);border-radius:6px;padding:8px 10px;overflow:auto;font-size:11.5px}
.md code{font-size:12px;background:var(--page);padding:1px 4px;border-radius:3px}
.md pre code{background:none;padding:0}
.md .mermaid{white-space:pre;font-family:ui-monospace,monospace}
.md input[type=checkbox]{vertical-align:middle}
.note{color:var(--muted);font-size:12px;margin:6px 0}
footer{color:var(--muted);font-size:12px;margin-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer code{font-size:11px}
[hidden]{display:none!important}
@media print{.tgl,.filters{display:none}section.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <h1 id="h-title">dev-team <span>· dashboard</span></h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <span class="spacer"></span>
  <span class="live" id="live"><i></i><span id="live-text">—</span></span>
  <button type="button" class="tgl" id="lang" title="Language">RU / EN</button>
  <button type="button" class="tgl" id="theme" title="Theme">☀ / ☾</button>

function md(src){

var navStack=[];
function openView(view,arg,push){
  var t=T(),top=navStack[navStack.length-1];
  if(push!==false&&!(top&&top.view===view&&String(top.arg)===String(arg)))navStack.push({view:view,arg:arg});
  if(navStack.length>12)navStack=navStack.slice(-12);
  var r=VIEWS[view]?VIEWS[view](arg,t):null;
  if(!r){closeDrawer();return;}
  $("dr-title").textContent=r.title;
  var crumbs="";
  if(navStack.length>1){
    var start=Math.max(0,navStack.length-4);
    crumbs='<div class="crumbs">'+(start?'<span class="chip">…</span>':"")+navStack.slice(start,-1).map(function(s,k){
      var idx=start+k,lf=VIEWS[s.view+"_label"],lab=lf?lf(s.arg,t):(s.arg||s.view);
      return'<span class="chip" data-nav="'+idx+'">'+h(lab)+'</span>';
    }).join("")+'</div>';
  }
  $("dr-body").innerHTML=crumbs+r.html;
  $("dr-back").hidden=navStack.length<2;
  $("drawer").hidden=false;$("overlay").hidden=false;
  document.body.style.overflow="hidden";
  if(r.after)r.after();
}
function closeDrawer(){navStack=[];$("drawer").hidden=true;$("overlay").hidden=true;document.body.style.overflow="";}

function gantt(tasks,t){
  var spans=tasks.map(function(x){return{task:x,span:taskSpan(x)};});
  var withSpan=spans.filter(function(s){return s.span;});
  if(!withSpan.length)return'<p class="note">'+h(t.dr.none)+'</p>';
  var min=Math.min.apply(null,withSpan.map(function(s){return +s.span.from;}));
  var max=Math.max.apply(null,withSpan.map(function(s){return +s.span.to;}));
  var now=+new Date();if(now>min&&now<max+1)max=Math.max(max,now);
  var range=Math.max(max-min,60000);
  var ticks="";
  for(var k=0;k<=4;k++){var tv=new Date(min+range*k/4);ticks+='<span style="left:'+(k*25)+'%">'+fmtDate(tv.toISOString())+'</span>';}
  var rows=spans.map(function(s){
    var x=s.task,st=x.status||"todo";
    if(!s.span)return'<div class="grow"><span class="glbl" data-open="task:'+h(x.id)+'"><b>'+h(x.id)+'</b>'+h(x.title||"")+'</span><span class="glane"></span></div>';
    var l=(+s.span.from-min)/range*100,w=Math.max((+s.span.to-+s.span.from)/range*100,.8);
    var dur=x.spentMinutes?fmtMin(x.spentMinutes):fmtDur(+s.span.to-+s.span.from);
    return'<div class="grow"><span class="glbl" data-open="task:'+h(x.id)+'"><b>'+h(x.id)+'</b>'+h(x.title||"")+'</span>'+
      '<span class="glane"><span class="gbar '+st+'" data-open="task:'+h(x.id)+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%" title="'+h((x.title||x.id)+" · "+(t.task_states[st]||st)+" · "+dur)+'">'+h(dur)+'</span></span></div>';
  }).join("");
  var nowLeft=now>=min&&now<=max?((now-min)/range*100):null;
  return'<div class="gantt"><div class="axis">'+ticks+'</div>'+rows+
    (nowLeft!==null?'<div class="now" style="left:calc('+nowLeft.toFixed(2)+'% * (100% - 170px) / 100)"></div>':"")+'</div>';
}

      (acts.length?'<h4>'+h(t.dr.active_now)+'</h4><div class="now">'+acts.map(function(a,idx){return'<div class="act" data-open="act:'+(S.activity.indexOf(a))+'"><span class="avatar">'+h(initials(t.roles[a.role]||a.role))+'</span><span><div class="who">'+h(roleLabel(t,a))+'</div><div class="what">'+h([a.task,a.action].filter(Boolean).join(" · "))+'</div></span><span class="t" data-since="'+h(a.startedAt||"")+'">'+fmtDur(new Date()-(ts(a.startedAt)||new Date()))+'</span></div>';}).join("")+'</div>':"")+
      '<h4>'+h(t.dr.timeline)+'</h4>'+gantt(tasks,t)+
      (children.length?'<h4>'+h(t.dr.children)+'</h4><div class="docs">'+children.map(function(c){return'<span class="chip t-'+c.type+'" data-open="ini:'+h(c.id)+'">'+h(c.id)+' · '+h(c.title||"")+'</span>';}).join("")+'</div>':"")+
      artifactsList([base+"/brief.md",base+"/requirements.md",base+"/analysis.md",base+"/design.md",base+"/tasks.md",base+"/dev-log.md",base+"/review.md",base+"/test-plan.md",base+"/test-report.md",base+"/acceptance.md"].concat(i.type==="epic"?[base+"/integration-report.md"]:[]),t)+
      '<h4>'+h(t.dr.events)+'</h4>'+eventsFor(function(e){return e.initiative===i.id||children.some(function(c){return c.id===e.initiative;});},t)};
  },
  ini_label:function(id){return id;},
  task:function(id,t){
    var f=findTask(id);if(!f)return null;
    var x=f.task,i=f.ini,st=x.status||"todo",sp=taskSpan(x);
    var card=x.card||((i.type==="epic"?"epics/":"initiatives/")+i.id+"/tasks/"+x.id+".md");
    var body='<dl class="kv"><dt>'+h(t.dr.status)+'</dt><dd>'+h(t.task_states[st]||st)+'</dd>'+
      '<dt>'+h(t.dr.initiative)+'</dt><dd><span class="chip t-'+i.type+'" data-open="ini:'+h(i.id)+'">'+h(i.id)+'</span></dd>'+
      (x.assignee?'<dt>'+h(t.dr.assignee)+'</dt><dd><span class="chip" data-open="role:'+h(String(x.assignee).split("#")[0])+'">'+h(t.roles[String(x.assignee).split("#")[0]]||x.assignee)+(String(x.assignee).indexOf("#")>0?" #"+String(x.assignee).split("#")[1]:"")+'</span></dd>':"")+
      (x.wave?'<dt>'+h(t.dr.wave)+'</dt><dd>'+h(x.wave)+'</dd>':"")+
      (x.branch?'<dt>'+h(t.dr.branch)+'</dt><dd><code>'+h(x.branch)+'</code>'+(x.worktree?' · <code>'+h(x.worktree)+'</code>':"")+'</dd>':"")+
      (x.mergedAt?'<dt>'+h(t.dr.merged)+'</dt><dd>'+fmtDate(x.mergedAt)+(x.mergeCommit?' · <code>'+h(String(x.mergeCommit).slice(0,8))+'</code>':"")+'</dd>':"")+
      (x.startedAt?'<dt>'+h(t.dr.started)+'</dt><dd>'+fmtDate(x.startedAt)+'</dd>':"")+
      (x.finishedAt?'<dt>'+h(t.dr.finished)+'</dt><dd>'+fmtDate(x.finishedAt)+'</dd>':(sp?'<dt>'+h(t.dr.elapsed)+'</dt><dd><span data-since="'+h(x.startedAt||"")+'">'+fmtDur(new Date()-sp.from)+'</span></dd>':""))+
      (x.spentMinutes?'<dt>'+h(t.dr.time_spent)+'</dt><dd>'+h(fmtMin(x.spentMinutes))+'</dd>':"")+
      (x.reviewIterations?'<dt>'+h(t.tasks_table)+'</dt><dd>'+h(x.reviewIterations)+'</dd>':"")+'</dl>';
    if(x.timeLog&&x.timeLog.length)
      body+='<h4>'+h(t.dr.time_log)+'</h4><table class="tbl"><thead><tr><th>'+h(t.dr.stage)+'</th><th>'+h(t.dr.started)+'</th><th>'+h(t.dr.finished)+'</th></tr></thead><tbody>'+
        x.timeLog.map(function(g){return'<tr><td>'+h(t.task_states[g.stage]||g.stage)+'</td><td>'+fmtDate(g.from)+'</td><td>'+(g.to?fmtDate(g.to):h(t.dr.now))+'</td></tr>';}).join("")+'</tbody></table>';
    body+='<h4>'+h(t.dr.task_card)+'</h4><div id="file-slot"></div>';
    return{title:x.id+" · "+(x.title||""),html:body,after:function(){loadFile(card,$("file-slot"),t);}};
  },
  task_label:function(id){return id;},
  act:function(idx,t){
    var a=(S.activity||[])[idx];if(!a)return null;
    var rn=t.roles[a.role]||a.role;
    return{title:roleLabel(t,a),html:'<dl class="kv"><dt>'+h(t.dr.agent)+'</dt><dd><span class="chip" data-open="role:'+h(a.role)+'">'+h(rn)+'</span>'+(a.instance?' #'+h(a.instance):"")+'</dd>'+
      (a.team?'<dt>'+h(t.dr.team)+'</dt><dd><span class="chip team" data-open="team:'+h(a.team)+'">'+h(teamName(a.team))+'</span></dd>':"")+
      (a.initiative?'<dt>'+h(t.dr.initiative)+'</dt><dd><span class="chip" data-open="ini:'+h(a.initiative)+'">'+h(a.initiative)+'</span></dd>':"")+
      (a.task?'<dt>'+h(t.dr.task)+'</dt><dd><span class="chip" data-open="task:'+h(a.task)+'">'+h(a.task)+'</span></dd>':"")+
      (a.action?'<dt>'+h(t.dr.action)+'</dt><dd>'+h(a.action)+'</dd>':"")+
      '<dt>'+h(t.dr.started)+'</dt><dd>'+fmtDate(a.startedAt)+'</dd>'+
      '<dt>'+h(t.dr.elapsed)+'</dt><dd><span data-since="'+h(a.startedAt||"")+'">'+fmtDur(new Date()-(ts(a.startedAt)||new Date()))+'</span></dd></dl>'+
      '<h4>'+h(t.dr.events)+'</h4>'+eventsFor(function(e){return e.role===a.role||(a.initiative&&e.initiative===a.initiative);},t,10)};
  },
  act_label:function(idx,t){var a=(S.activity||[])[idx];return a?(t.roles[a.role]||a.role):"?";},
  role:function(role,t){
    var acts=(S.activity||[]).filter(function(a){return a.role===role&&!a.finishedAt;});
    var hist=(S.activity||[]).filter(function(a){return a.role===role&&a.finishedAt;}).slice(-8).reverse();
    var tasks=[];(S.initiatives||[]).forEach(function(i){(i.tasks||[]).forEach(function(x){if(x.assignee&&String(x.assignee).split("#")[0]===role)tasks.push({t:x,i:i});});});
    return{title:t.roles[role]||role,html:
      '<h4>'+h(t.dr.active_now)+'</h4>'+(acts.length?'<div class="now">'+acts.map(function(a){return'<div class="act" data-open="act:'+S.activity.indexOf(a)+'"><span class="avatar">'+h(initials(t.roles[role]||role))+'</span><span><div class="who">'+h(roleLabel(t,a))+'</div><div class="what">'+h([a.initiative,a.task,a.action].filter(Boolean).join(" · "))+'</div></span><span class="t" data-since="'+h(a.startedAt||"")+'">'+fmtDur(new Date()-(ts(a.startedAt)||new Date()))+'</span></div>';}).join("")+'</div>':'<p class="note">'+h(t.dr.none)+'</p>')+
      (tasks.length?'<h4>'+h(t.tasks)+'</h4><div class="docs">'+tasks.map(function(o){return'<span class="chip" data-open="task:'+h(o.t.id)+'">'+h(o.t.id)+' · '+h(o.t.title||"")+'</span>';}).join("")+'</div>':"")+
      (hist.length?'<h4>'+h(t.dr.history)+'</h4><table class="tbl"><tbody>'+hist.map(function(a){return'<tr><td>'+fmtDate(a.startedAt)+'</td><td>'+h([a.initiative,a.task,a.action].filter(Boolean).join(" · "))+'</td></tr>';}).join("")+'</tbody></table>':"")+
      '<h4>'+h(t.dr.events)+'</h4>'+eventsFor(function(e){return e.role===role;},t,10)};
  },
  role_label:function(role,t){return t.roles[role]||role;},
  team:function(id,t){
    var tm=(S.teams||[]).filter(function(x){return x.id===id;})[0];if(!tm)return null;
    var ep=findIni(tm.epic);
    var mine=(S.initiatives||[]).filter(function(i){return i.team===id||i.id===tm.epic||(ep&&i.epic===ep.id);});
    var tasks=[];mine.forEach(function(i){tasks=tasks.concat(i.tasks||[]);});
    var acts=(S.activity||[]).filter(function(a){return a.team===id&&!a.finishedAt;});
    return{title:(tm.name||tm.id)+" · "+(tm.epic||""),html:
      '<dl class="kv">'+(tm.epic?'<dt>'+h(t.types.epic)+'</dt><dd><span class="chip t-epic" data-open="ini:'+h(tm.epic)+'">'+h(tm.epic)+'</span></dd>':"")+
      (tm.branch?'<dt>'+h(t.dr.branch)+'</dt><dd><code>'+h(tm.branch)+'</code></dd>':"")+
      (ep?'<dt>'+h(t.dr.stage)+'</dt><dd>'+h(t.stages[ep.stage])+(ep.wave?' · '+h(t.dr.wave)+' '+ep.wave:"")+'</dd>':"")+
      ((tm.ownership||[]).length?'<dt>'+h(t.dr.ownership)+'</dt><dd><code>'+(tm.ownership||[]).map(h).join("</code>, <code>")+'</code></dd>':"")+'</dl>'+
      '<h4>'+h(t.dr.members)+'</h4><div class="docs">'+Object.keys(tm.members||{}).map(function(r){return'<span class="chip" data-open="role:'+h(r)+'">'+h(t.roles[r]||r)+(tm.members[r]>1?" ×"+tm.members[r]:"")+'</span>';}).join("")+'</div>'+
      '<h4>'+h(t.dr.overview)+'</h4>'+taskStats(tasks,t)+
      (acts.length?'<h4>'+h(t.dr.active_now)+'</h4><div class="now">'+acts.map(function(a){return'<div class="act" data-open="act:'+S.activity.indexOf(a)+'"><span class="avatar">'+h(initials(t.roles[a.role]||a.role))+'</span><span><div class="who">'+h(roleLabel(t,a))+'</div><div class="what">'+h([a.initiative,a.task,a.action].filter(Boolean).join(" · "))+'</div></span><span class="t" data-since="'+h(a.startedAt||"")+'">'+fmtDur(new Date()-(ts(a.startedAt)||new Date()))+'</span></div>';}).join("")+'</div>':"")+
      '<h4>'+h(t.dr.timeline)+'</h4>'+gantt(tasks,t)};
  },
  team_label:function(id){return teamName(id);},
  file:function(path,t){
    return{title:String(path).split("/").pop(),html:'<p class="note"><code>'+h(path)+'</code></p><div id="file-slot"></div>',after:function(){loadFile(path,$("file-slot"),t);}};
  },
  file_label:function(path){return String(path).split("/").pop();},
  release:function(v,t){
    var r=(S.releases||[]).filter(function(x){return x.version===v;})[0];if(!r)return null;
    return{title:r.version,html:'<dl class="kv"><dt>'+h(t.th.date)+'</dt><dd>'+h(r.date||"")+'</dd><dt>'+h(t.th.contents)+'</dt><dd>'+(r.initiatives||[]).map(function(x){return'<span class="chip" data-open="ini:'+h(x)+'">'+h(x)+'</span>';}).join(" ")+'</dd></dl>'+
      artifactsList(["releases/"+r.version+".md","releases/"+r.version+"-notes.md"],t)+
      '<h4>'+h(t.dr.events)+'</h4>'+eventsFor(function(e){return (e.text||"").indexOf(r.version)>=0;},t,10)};
  },
  release_label:function(v){return v;}
};
var DOCS=[["vision","project/vision.md"],["research","project/research.md"],["prd","requirements/prd.md"],["stories","requirements/user-stories.md"],["nfr","requirements/nfr.md"],["overview","architecture/overview.md"],["contracts","architecture/contracts.md"],["epics","plan/epics.md"],["ownership","plan/ownership.md"],["roadmap","plan/roadmap.md"],["risks","plan/risks.md"],["backlog","plan/backlog.md"],["strategy","testing/strategy.md"],["changelog","docs/CHANGELOG.md"],["journal","journal.md"],["state","state.md"]];
function applyFilters(){document.querySelectorAll("[data-type]").forEach(function(el){var ok=typeFilter==="all"||el.getAttribute("data-type")===typeFilter;if(el.getAttribute("data-status")==="done"&&!showDone)ok=false;el.hidden=!ok;});}
function updateLive(){
  var t=T(),el=$("live"),txt=$("live-text");if(!S)return;
  var fin=ts(S.finishedAt),upd=ts(S.updatedAt),fresh=upd&&(new Date()-upd)<IDLE_MS;
  el.className="live "+(fin?"finished":fresh?"on":"");
  txt.textContent=fin?t.finished:fresh?t.live:t.idle+(upd?" · "+fmtDur(new Date()-upd):"");
}
function tick(){
  if(!S)return;var now=new Date();
  document.querySelectorAll("[data-since]").forEach(function(el){var d=ts(el.getAttribute("data-since"));if(d)el.textContent=fmtDur(now-d);});
  var st=ts(S.startedAt),ke=$("kpi-elapsed");if(st&&ke&&!S.finishedAt)ke.textContent=fmtDur(now-st);
  updateLive();
}
function adopt(raw){if(!raw)return;var u=raw.updatedAt||"";if(S&&u===lastUpdated)return;lastUpdated=u;S=normalize(raw);render();}
function poll(){
  var s=document.createElement("script");s.src="state.js?t="+Date.now();
  s.onload=function(){s.remove();adopt(window.DEVTEAM_STATE);schedule();};
  s.onerror=function(){s.remove();schedule();};
  document.head.appendChild(s);
}
function schedule(){setTimeout(poll,(S&&S.finishedAt)?POLL_MS*6:POLL_MS);}
document.addEventListener("click",function(e){
  var nav=e.target.closest("[data-nav]");
  if(nav){var idx=+nav.getAttribute("data-nav");var target=navStack[idx];navStack=navStack.slice(0,idx);openView(target.view,target.arg);return;}
  var op=e.target.closest("[data-open]");
  if(op&&!e.target.closest("button")){
    var v=op.getAttribute("data-open"),p=v.indexOf(":");
    openView(v.slice(0,p),v.slice(p+1));e.preventDefault();return;
  }
  if(e.target.id==="dr-close"||e.target.id==="overlay"){closeDrawer();return;}
  if(e.target.id==="dr-back"){goBack();return;}
  var b=e.target.closest("button[data-filter]");if(b){typeFilter=b.getAttribute("data-filter");render();return;}
  if(e.target.id==="tasks-toggle"){showTable=!showTable;render();return;}
  if(e.target.id==="theme"){var r=document.documentElement,cur=r.getAttribute("data-theme"),dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches,next=dark?"light":"dark";r.setAttribute("data-theme",next);try{localStorage.setItem("devteam-theme",next);}catch(x){}return;}
  if(e.target.id==="lang"){lang=lang==="ru"?"en":"ru";try{localStorage.setItem("devteam-lang",lang);}catch(x){}render();return;}
});
document.addEventListener("change",function(e){if(e.target.id==="show-done"){showDone=e.target.checked;applyFilters();}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("drawer").hidden){if(navStack.length>1)goBack();else closeDrawer();}});
adopt(window.DEVTEAM_STATE||window.DEVTEAM_SNAPSHOT||{initiatives:[]});
if(S&&S.language&&!localStorage.getItem("devteam-lang")){lang=String(S.language).slice(0,2)==="ru"?"ru":"en";render();}
setInterval(tick,1000);schedule();
})();
