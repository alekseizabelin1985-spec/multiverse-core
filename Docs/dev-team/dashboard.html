<head>
<meta charset="utf-8">

<title>dev-team · dashboard</title>
<style>
:root{color-scheme:light;
 --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
 --s1:#2a78d6;--s1-soft:#cde2fb;--s2:#eb6834;--s3:#1baf7a;--s7:#4a3aa7;
 --done:#1c5cab;--review:#2a78d6;--prog:#6da7ec;--todo:#e1e0d9;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--good-text:#006300;
 --radius:12px;--shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px -16px rgba(11,11,11,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
 --s1:#3987e5;--s1-soft:#184f95;--s2:#d95926;--s3:#199e70;--s7:#9085e9;
 --done:#9ec5f4;--review:#5598e7;--prog:#256abf;--todo:#383835;--good-text:#0ca30c;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
 --s1:#3987e5;--s1-soft:#184f95;--s2:#d95926;--s3:#199e70;--s7:#9085e9;
 --done:#9ec5f4;--review:#5598e7;--prog:#256abf;--todo:#383835;--good-text:#0ca30c;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 44px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.01em}
.top h1 span{color:var(--muted);font-weight:500}
.top .sub{color:var(--ink2);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.top .spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);padding:5px 10px;border:1px solid var(--ring);border-radius:999px;background:var(--surface)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on{color:var(--good-text)}.live.on i{background:var(--good);animation:pulse 1.6s infinite}
.live.finished{color:var(--s1)}.live.finished i{background:var(--s1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.45)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
button.tgl{font:inherit;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:5px 11px;cursor:pointer}
button.tgl:hover{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:650;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:5px}
.kpi .v.warn{color:var(--serious)}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.kpi .sub .s-crit{color:var(--crit);font-weight:600}.kpi .sub .s-serious{color:var(--serious);font-weight:600}
.prog{height:6px;background:var(--todo);border-radius:4px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--s1);border-radius:4px;transition:width .4s}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
section.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
section.card>header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px}
section.card h2{margin:0;font-size:15px;font-weight:650}
.hint{color:var(--muted);font-size:12px}
.sp{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters button{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--ring);background:transparent;color:var(--ink2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.filters label{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;margin-left:6px}
.empty{color:var(--muted);margin:6px 0}
/* now */
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.act{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--s1);border-radius:10px;background:color-mix(in srgb,var(--s1) 6%,var(--surface))}
.act .avatar{width:36px;height:36px;border-radius:50%;background:var(--s1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.act .who{font-weight:600;font-size:13px}
.act .what{font-size:12px;color:var(--ink2)}
.act .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--s1);font-weight:600}
/* initiatives */
.ini{border-top:1px solid var(--grid);padding:12px 0}
.ini:first-child{border-top:0;padding-top:2px}
.ini header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ini .iid{font-variant-numeric:tabular-nums}
.ini .ititle{color:var(--ink2)}
.ini .stage-now{margin-left:auto;font-size:12px;color:var(--s1);font-weight:600;display:flex;gap:8px;align-items:center}
.ini .stage-now .t{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ini.done .stage-now{color:var(--good-text)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--ring);color:var(--ink2);white-space:nowrap}
.chip.t-feature{border-color:var(--s1);color:var(--s1)}.chip.t-bug{border-color:var(--s2);color:var(--s2)}.chip.t-project{border-color:var(--s7);color:var(--s7)}.chip.t-epic{border-color:var(--s3);color:var(--s3)}
.chip.size{background:var(--grid);border-color:transparent}
.chip.team{background:color-mix(in srgb,var(--s3) 12%,transparent);border-color:transparent;color:var(--ink2)}
.chip.on{border-color:var(--s1);color:var(--s1)}
.ini.child{padding-left:18px;border-left:3px solid color-mix(in srgb,var(--s3) 35%,transparent)}
/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.teamcard{border:1px solid var(--grid);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.teamcard.done{opacity:.7}
.teamcard header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teamcard header strong{font-size:14px}
.teamcard .stage-now{margin-left:auto;font-size:12px;color:var(--s1);font-weight:600}
.teamcard .meta code{font-size:11px;color:var(--muted)}
.teamcard .members{display:flex;flex-wrap:wrap;gap:4px}
.teamcard .tprog{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.teamcard .tprog .prog{margin:0}
.teamcard .tnow{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.role .avatar{position:relative}
.role .cnt{position:absolute;right:-6px;top:-6px;font-size:9px;background:var(--s2);color:#fff;border-radius:999px;padding:1px 4px;line-height:1.2}
.pipe{list-style:none;margin:10px 0 0;padding:0;display:flex;align-items:flex-start;overflow-x:auto}
.pipe li{position:relative;display:flex;flex-direction:column;align-items:center;min-width:60px;flex:1;font-size:11px;color:var(--muted)}
.pipe li.gate{min-width:34px;flex:0 0 34px}
.pipe li::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--grid);z-index:0}
.pipe li:first-child::before{left:50%}.pipe li:last-child::before{right:50%}
.pipe .dot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--axis)}
.pipe .st-done .dot{background:var(--s1);border-color:var(--s1)}
.pipe .st-done::before{background:var(--s1)}
.pipe .st-cur .dot{background:var(--surface);border-color:var(--s1);box-shadow:0 0 0 4px var(--s1-soft)}
.pipe .st-cur .lbl{color:var(--ink);font-weight:600}
.pipe .st-done .lbl{color:var(--ink2)}
.pipe .lbl,.pipe .glbl{margin-top:6px;white-space:nowrap}
.pipe .dia{position:relative;z-index:1;width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:var(--surface);border:2px solid var(--axis);display:flex;align-items:center;justify-content:center}
.pipe .dia svg{transform:rotate(-45deg);width:11px;height:11px}
.pipe .g-ok .dia{background:var(--good);border-color:var(--good);color:#fff}
.pipe .g-warn .dia{background:var(--warn);border-color:var(--warn);color:#0b0b0b}
.pipe .g-crit .dia{background:var(--crit);border-color:var(--crit);color:#fff}
.pipe .g-na .dia{background:var(--grid);border-color:var(--grid);color:var(--muted)}
.pipe .g-ok::before,.pipe .g-na::before{background:var(--s1)}
.pipe .glbl{font-weight:600}
.pipe .g-warn .glbl,.pipe .g-crit .glbl{color:var(--ink)}
.ini .next{margin:8px 0 0;font-size:12px;color:var(--ink2)}
.ini .next span{color:var(--muted)}
.ini .tasklist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.ini .tasklist li{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--grid);color:var(--ink2);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.ini .tasklist li i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ini .tasklist li.done{opacity:.75}.ini .tasklist li.in-progress{border-color:var(--s1);color:var(--ink)}
/* tasks */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:8px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.todo,.seg.todo,.tasklist i.todo{background:var(--todo)}
.sw.in-progress,.seg.in-progress,.tasklist i.in-progress{background:var(--prog)}
.sw.review,.seg.review,.tasklist i.review{background:var(--review)}
.sw.done,.seg.done,.tasklist i.done{background:var(--done)}
.bar-row{display:grid;grid-template-columns:minmax(140px,220px) 1fr 52px;align-items:center;gap:10px;padding:5px 0}
.bar-lbl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-lbl em{font-style:normal;color:var(--ink2)}
.bar{display:flex;gap:2px;height:18px}
.seg{display:flex;align-items:center;justify-content:center;border-radius:3px;min-width:4px;transition:width .4s,filter .15s}
.seg:first-child{border-radius:4px 3px 3px 4px}.seg:last-child{border-radius:3px 4px 4px 3px}
.seg b{font-size:11px;font-weight:600;color:var(--ink)}
.seg.done b,.seg.review b{color:#fff}
:root[data-theme="dark"] .seg.done b,:root[data-theme="dark"] .seg.review b{color:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.done b,:root:not([data-theme="light"]) .seg.review b{color:#0b0b0b}}
.seg:hover{filter:brightness(1.12)}
.bar-val{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
/* defects */
.def-total{font-size:28px;font-weight:650;margin:-2px 0 6px}
.def-row{display:grid;grid-template-columns:92px 1fr 28px;align-items:center;gap:10px;padding:4px 0;font-size:12px}
.def-lbl{display:flex;align-items:center;gap:6px;font-weight:600}
.s-crit{color:var(--crit)}.s-serious{color:var(--serious)}.s-warn{color:var(--warn)}.s-ok{color:var(--good-text)}
.def-bar{height:10px;background:var(--todo);border-radius:4px;overflow:hidden}
.def-fill{display:block;height:100%;border-radius:4px;transition:width .4s}
.def-fill.s-crit{background:var(--crit)}.def-fill.s-serious{background:var(--serious)}.def-fill.s-warn{background:var(--warn)}
.def-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--grid)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.gcell{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.gcell.g-ok{color:var(--good-text)}.gcell.g-warn{color:var(--serious)}.gcell.g-crit{color:var(--crit)}.gcell.g-na,.gcell.g-ahead{color:var(--muted)}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.role{display:grid;grid-template-columns:32px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--grid)}
.role .avatar{grid-row:1/3;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--grid);color:var(--ink2)}
.role .rname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role .rstate{font-size:11px;color:var(--muted)}
.role.r-active{border-color:var(--s1)}.role.r-active .avatar{background:var(--s1);color:#fff}.role.r-active .rstate{color:var(--s1);font-weight:600}
.role.r-done .avatar{background:var(--s1-soft);color:var(--ink)}
.role.r-idle{opacity:.7}
/* timeline */
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--grid);max-height:520px;overflow:auto}
.timeline li{position:relative;padding:3px 0 9px 14px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.timeline li::before{content:"";position:absolute;left:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--axis);border:2px solid var(--surface)}
.timeline li.tl-ok::before{background:var(--good)}.timeline li.tl-warn::before{background:var(--warn)}.timeline li.tl-crit::before{background:var(--crit)}
.timeline time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:96px}
.timeline .role{display:inline;padding:0;border:0;font-size:12px;color:var(--s1);font-weight:600}
.timeline .tl-text{color:var(--ink2);flex:1 1 55%}
.blockers{margin:0;padding-left:18px;color:var(--ink2)}.blockers li{margin:4px 0}
footer{color:var(--muted);font-size:12px;margin-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer code{font-size:11px}
[hidden]{display:none!important}
@media print{.tgl,.filters{display:none}section.card{break-inside:avoid;box-shadow:none}}
</style>
</head>

    var mx=Math.max.apply(null,withTasks.map(function(i){return total(i.counts);}))||1;
    var legend='<div class="legend">'+TASK_STATES.map(function(k){return'<span class="lg"><i class="sw '+k+'"></i>'+h(t.task_states[k])+'</span>';}).join("")+'</div>';
    var bars=withTasks.map(function(i){var tot2=total(i.counts);return'<div class="bar-row" data-type="'+i.type+'" data-status="'+(i.status==="done"?"done":"active")+'"><span class="bar-lbl"><strong>'+h(i.id)+'</strong> <em>'+h(i.title||"")+'</em></span><span class="bar">'+TASK_STATES.filter(function(k){return i.counts[k];}).map(function(k){return'<span class="seg '+k+'" style="width:'+(i.counts[k]/mx*100).toFixed(2)+'%" title="'+h(t.task_states[k])+': '+i.counts[k]+'"><b>'+i.counts[k]+'</b></span>';}).join("")+'</span><span class="bar-val">'+(i.counts.done||0)+'/'+tot2+'</span></div>';}).join("");
    var rows=withTasks.map(function(i){return'<tr data-type="'+i.type+'" data-status="'+(i.status==="done"?"done":"active")+'"><td>'+h(i.id)+'</td><td>'+h(i.title||"")+'</td>'+TASK_STATES.map(function(k){return'<td class="num">'+(i.counts[k]||0)+'</td>';}).join("")+'<td class="num">'+total(i.counts)+'</td></tr>';}).join("");
    $("tasks").innerHTML=legend+'<div id="tasks-chart"'+(showTable?" hidden":"")+'>'+bars+'</div><table class="tbl"'+(showTable?"":" hidden")+'><thead><tr><th>'+h(t.th.id)+'</th><th>'+h(t.th.title)+'</th><th>'+h(t.th.todo)+'</th><th>'+h(t.th.progress)+'</th><th>'+h(t.th.review)+'</th><th>'+h(t.th.done)+'</th><th>'+h(t.th.total)+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  // gates
  $("gates").innerHTML=active.length?'<table class="tbl"><thead><tr><th>'+h(t.th.id)+'</th>'+GATES.map(function(g){return"<th>"+g+"</th>";}).join("")+'</tr></thead><tbody>'+active.map(function(i){return'<tr data-type="'+i.type+'"><td><strong>'+h(i.id)+'</strong></td>'+GATES.map(function(g){var gs=gateState(i,g),gv=GATE_VISUAL[gs]||GATE_VISUAL["-"];return'<td><span class="gcell '+gv[0]+'">'+(gv[1]?ic(gv[1]):"·")+'<span>'+h(t.gate_states[gs]||gs)+'</span></span></td>';}).join("")+'</tr>';}).join("")+'</tbody></table>':'<p class="empty">'+h(t.none)+'</p>';
  // team
  var rs={};ROLES.forEach(function(r){rs[r]="idle";});
  active.forEach(function(i){var cur=STAGES.indexOf(i.stage);STAGES.forEach(function(st,idx){STAGE_ROLES[st].forEach(function(r){if(idx===cur)rs[r]="active";else if(idx<cur&&rs[r]!=="active")rs[r]="done";});});});
  var cnt={};act.forEach(function(a){if(rs[a.role]!==undefined)rs[a.role]="active";cnt[a.role]=(cnt[a.role]||0)+1;});
  $("team").innerHTML=ROLES.map(function(r){var rn=t.roles[r];return'<div class="role r-'+rs[r]+'" title="'+h(t.role_states[rs[r]])+'"><span class="avatar">'+h(initials(rn))+(cnt[r]>1?'<b class="cnt">×'+cnt[r]+'</b>':"")+'</span><span class="rname">'+h(rn)+'</span><span class="rstate">'+h(t.role_states[rs[r]])+(cnt[r]>1?' ×'+cnt[r]:"")+'</span></div>';}).join("");
  // defects
  var mxd=Math.max.apply(null,SEV.map(function(k){return def[k];}))||1;
  $("defects").innerHTML='<div class="def-total">'+defTotal+'</div>'+SEV.map(function(k){return'<div class="def-row"><span class="def-lbl '+SEV_CLASS[k]+'">'+ic("bug")+h(t.severities[k])+'</span><span class="def-bar"><span class="def-fill '+SEV_CLASS[k]+'" style="width:'+(def[k]?def[k]/mxd*100:0).toFixed(1)+'%"></span></span><span class="def-val">'+def[k]+'</span></div>';}).join("");
  // blockers
  $("blockers").innerHTML=S.blockers.length?'<ul class="blockers">'+S.blockers.map(function(b){return"<li>"+h(typeof b==="string"?b:(b.text||JSON.stringify(b)))+"</li>";}).join("")+'</ul>':'<p class="empty">'+h(t.none)+'</p>';
  // timeline
  var ev=S.events.slice(-60).reverse();
  $("timeline").innerHTML=ev.length?'<ol class="timeline">'+ev.map(function(e){var low=(e.text||"").toLowerCase(),cls=/утвержд|approved|принят|accepted|выпущен|released|готов|done/.test(low)?"tl-ok":/возвращ|returned|отклон|rejected|blocker|critical|ошибк|failed/.test(low)?"tl-crit":/ждёт|ожида|pending|вопрос|question/.test(low)?"tl-warn":"tl-neutral";return'<li class="'+cls+'"><time>'+fmtDate(e.at)+'</time>'+(e.initiative?'<span class="chip">'+h(e.initiative)+'</span>':"")+(e.role?'<span class="role">'+h(t.roles[e.role]||e.role)+'</span>':"")+'<span class="tl-text">'+h(e.text||"")+'</span></li>';}).join("")+'</ol>':'<p class="empty">'+h(t.none)+'</p>';
  // risks
  function lvl(v){v=String(v||"").toLowerCase();return/выс|high|крит/.test(v)?"s-crit":/сред|med/.test(v)?"s-warn":"s-ok";}
  $("risks").innerHTML=S.risks.length?'<table class="tbl"><thead><tr><th>'+h(t.th.id)+'</th><th>'+h(t.th.risk)+'</th><th>'+h(t.th.prob)+'</th><th>'+h(t.th.impact)+'</th><th>'+h(t.th.status)+'</th></tr></thead><tbody>'+S.risks.slice(0,12).map(function(r){return'<tr><td>'+h(r.id||"")+'</td><td>'+h(r.title||"")+'</td><td><span class="pill '+lvl(r.probability)+'">'+h(r.probability||"")+'</span></td><td><span class="pill '+lvl(r.impact)+'">'+h(r.impact||"")+'</span></td><td>'+h(r.status||"")+'</td></tr>';}).join("")+'</tbody></table>':'<p class="empty">'+h(t.none)+'</p>';
  // releases
  $("releases").innerHTML=S.releases.length?'<table class="tbl"><thead><tr><th>'+h(t.th.version)+'</th><th>'+h(t.th.date)+'</th><th>'+h(t.th.contents)+'</th></tr></thead><tbody>'+S.releases.slice().reverse().map(function(r){return'<tr><td><strong>'+h(r.version)+'</strong></td><td>'+h(r.date||"")+'</td><td>'+(r.initiatives||[]).map(h).join(", ")+'</td></tr>';}).join("")+'</tbody></table>':'<p class="empty">'+h(t.none)+'</p>';
  $("f-updated").textContent=fmtDate(S.updatedAt);
  applyFilters();updateLive();
}
function applyFilters(){document.querySelectorAll("[data-type]").forEach(function(el){var ok=typeFilter==="all"||el.getAttribute("data-type")===typeFilter;if(el.getAttribute("data-status")==="done"&&!showDone)ok=false;el.hidden=!ok;});}
function updateLive(){
  var t=T(),el=$("live"),txt=$("live-text");if(!S)return;
  var fin=ts(S.finishedAt),upd=ts(S.updatedAt),fresh=upd&&(new Date()-upd)<IDLE_MS;
  el.className="live "+(fin?"finished":fresh?"on":"");
  txt.textContent=fin?t.finished:fresh?t.live:t.idle+(upd?" · "+fmtDur(new Date()-upd):"");
}
function tick(){
  if(!S)return;var now=new Date();
  document.querySelectorAll("[data-since]").forEach(function(el){var d=ts(el.getAttribute("data-since"));if(d)el.textContent=fmtDur(now-d);});
  var st=ts(S.startedAt),ke=$("kpi-elapsed");if(st&&ke&&!S.finishedAt)ke.textContent=fmtDur(now-st);
  updateLive();
}
function adopt(raw){if(!raw)return;var u=raw.updatedAt||"";if(S&&u===lastUpdated)return;lastUpdated=u;S=normalize(raw);render();}
function poll(){
  var s=document.createElement("script");s.src="state.js?t="+Date.now();
  s.onload=function(){s.remove();adopt(window.DEVTEAM_STATE);schedule();};
  s.onerror=function(){s.remove();schedule();};
  document.head.appendChild(s);
}
function schedule(){setTimeout(poll,(S&&S.finishedAt)?POLL_MS*6:POLL_MS);}
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-filter]");if(b){typeFilter=b.getAttribute("data-filter");render();return;}
  if(e.target.id==="tasks-toggle"){showTable=!showTable;render();return;}
  if(e.target.id==="theme"){var r=document.documentElement,cur=r.getAttribute("data-theme"),dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches,next=dark?"light":"dark";r.setAttribute("data-theme",next);try{localStorage.setItem("devteam-theme",next);}catch(x){}return;}
  if(e.target.id==="lang"){lang=lang==="ru"?"en":"ru";try{localStorage.setItem("devteam-lang",lang);}catch(x){}render();return;}
});
document.addEventListener("change",function(e){if(e.target.id==="show-done"){showDone=e.target.checked;applyFilters();}});
adopt(window.DEVTEAM_STATE||window.DEVTEAM_SNAPSHOT||{initiatives:[]});
if(S&&S.language&&!localStorage.getItem("devteam-lang")){lang=String(S.language).slice(0,2)==="ru"?"ru":"en";render();}
setInterval(tick,1000);schedule();
})();
</script>
</body>
</html>
