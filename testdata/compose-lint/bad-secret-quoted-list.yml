# Rule 3: a literal credential in a list item wrapped in quotes as a whole,
# `- "KEY=value"` — a common spelling of compose files, and the one N-3's
# pattern missed as well (review #1 T-411). Placeholder, never a credential.
#
# expect-rule: 3
# expect-text: MINIO_ROOT_PASSWORD carries the literal
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      - "MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}"
      - "MINIO_ROOT_PASSWORD=fixture-only-not-a-secret-0000"
