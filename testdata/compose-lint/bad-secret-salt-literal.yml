# Rule 3: a literal MV_TELEGRAM_ACTION_KEY_SALT, the HMAC key of action_key
# (ADR-018, T-310). The manifest declares it Secret(), but its name ends in
# `_SALT`, past the `MV_.*_KEY` of rule 3, and rule 8 does not read literals of
# platform variables: until T-464 this file passed every rule. The salt is not
# a required secret, so the refusal advises `${VAR:-}` and not `:?`, which
# would stop the bot profile that is right to start without it (T-464 review
# #1 Mi-1), and it does not print the value (N-2). Placeholder, never a salt.
#
# expect-rule: 3
# expect-text: MV_TELEGRAM_ACTION_KEY_SALT carries the literal <withheld>
# expect-text: use ${MV_TELEGRAM_ACTION_KEY_SALT:-}: an optional secret
# expect-absent: use ${MV_TELEGRAM_ACTION_KEY_SALT:?
# expect-absent: xxxxxxxxxxxxxxxx
services:
  telegram-bot:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_TELEGRAM_ACTION_KEY_SALT: xxxxxxxxxxxxxxxx
