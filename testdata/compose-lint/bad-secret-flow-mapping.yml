# Rule 3 and a flow mapping (T-429; T-413 review #1 N-1, probe n02; the class
# predates T-413). `environment: {KEY: value, ...}` is the same mapping as the
# block form, and compose v5.2.0 hands MinIO the literal password below. The
# line reader looked for one key per line and saw none here. Placeholder,
# never a credential.
#
# expect-rule: 3
# expect-text: MINIO_ROOT_PASSWORD carries the literal
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}", MINIO_ROOT_PASSWORD: fixture-only-not-a-secret-0000}
