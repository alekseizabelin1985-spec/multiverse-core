# Rule 3 and MV_ANTHROPIC_API_KEY written as a literal (T-470 handover to
# T-469, review #1 Mi-3). The key is an optional secret, legitimately empty for
# a local provider, so the advice is its own interpolation with the manifest's
# empty default, `${MV_ANTHROPIC_API_KEY:-}`, and not `:?`. The value is a
# placeholder that looks like no key, and the report prints <withheld> for it.
#
# expect-rule: 3
# expect-text: MV_ANTHROPIC_API_KEY carries the literal <withheld>
# expect-text: use ${MV_ANTHROPIC_API_KEY:-}: an optional secret
# expect-absent: placeholder
services:
  core:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_ANTHROPIC_API_KEY: placeholder
