# Rule 3: a credential the stack must refuse to start without, passed through
# as a key with no value. With .env silent, compose simply leaves it out of the
# container and MinIO starts on the account it ships with instead of refusing
# (SEC-14). Rule 8 recommends the valueless form for allow-lists (T-411); for
# a required secret it is never right — that needs ${VAR:?}.
#
# expect-rule: 3
# expect-text: MINIO_ROOT_USER is passed through with no value
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      MINIO_ROOT_USER:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
