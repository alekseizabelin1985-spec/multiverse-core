# Rule 3 and the escape of N-1: `$${VAR:?}` is not an interpolation. Compose
# hands the container the literal text `${MINIO_ROOT_PASSWORD:?set it}` as the
# password — a default credential, spelled so that it looks like the correct
# form. The pattern of rule 3 read it as a required interpolation (T-413).
#
# expect-rule: 3
# expect-text: MINIO_ROOT_PASSWORD carries the literal
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      MINIO_ROOT_PASSWORD: $${MINIO_ROOT_PASSWORD:?set it}
