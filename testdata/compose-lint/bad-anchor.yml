# Rule 3: an anchor that is not called x-platform-env. Secrets do not become
# safe by being merged in from a differently named block (SEC-14).
x-extra-env: &extra-env
  NEO4J_PASSWORD: fixture-only-not-a-secret
  MV_MINIO_SECRET_KEY: fixture-only-not-a-secret-0000

services:
  core:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      <<: *extra-env
