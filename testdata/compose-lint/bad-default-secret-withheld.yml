# Rule 8 and a secret: MV_TELEGRAM_ACTION_KEY_SALT with a default of its own.
# Rule 3 lets an interpolation of an optional secret through, and rule 8 finds
# two sources of one value, as for any variable - but the refusal would print
# the salt into the log of CI. It prints <withheld> in place of the value, in
# the plain interpolation, inside another variable's default (MV_WORLD_ID,
# checked on its own, is withheld too: it sits in the salt's value), behind
# `+`, and when a secret's key takes another variable with a default of its
# own (C-15 v1.5; T-464 review #1 N-2). fakesalt is a placeholder, never a salt.
#
# expect-rule: 8
# expect-text: MV_TELEGRAM_ACTION_KEY_SALT defaults to <withheld> here and to '' in shared/env/vars.go
# expect-text: MV_TELEGRAM_ACTION_KEY_SALT falls back to another variable here (<withheld>)
# expect-text: MV_WORLD_ID defaults to <withheld> here
# expect-text: ${MV_TELEGRAM_ACTION_KEY_SALT:+<withheld>} hands the process compose's own text
# expect-absent: fakesalt
services:
  telegram-bot:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_TELEGRAM_ACTION_KEY_SALT: ${MV_TELEGRAM_ACTION_KEY_SALT:-fakesalt-one}
  gm:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_TELEGRAM_ACTION_KEY_SALT: ${MV_TELEGRAM_ACTION_KEY_SALT:-${MV_WORLD_ID:-fakesalt-two}}
  core:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_TELEGRAM_ACTION_KEY_SALT: ${MV_TELEGRAM_ACTION_KEY_SALT:+fakesalt-three}
  gateway:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_ANTHROPIC_API_KEY: ${MV_WORLD_ID:-fakesalt-four}
