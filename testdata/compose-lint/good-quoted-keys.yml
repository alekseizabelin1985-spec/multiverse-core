# A clean file for rule 3 (review #1 T-411, N-3): quoted keys and quoted list
# items are read as keys, so the required credentials below are recognised as
# the correct `${VAR:?}` form rather than refused or skipped.
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      "MINIO_ROOT_USER": ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      'MINIO_ROOT_PASSWORD': ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  minio-init:
    image: ${MC_IMAGE:?set MC_IMAGE in build/versions.env}
    environment:
      - "MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}"
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}'
