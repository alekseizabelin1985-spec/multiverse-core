# Rule 3: a credential the stack must refuse to start without, given a default
# of its own. A missing MINIO_ROOT_PASSWORD would then start MinIO on the
# default instead of stopping the stack, so it needs `${VAR:?}`. The refusal
# does not print the default: it is a password written into the file, and the
# report goes to the log of CI (C-15 v1.5; T-464 review #1 N-2). fakesecret is
# a placeholder, never a password.
#
# expect-rule: 3
# expect-text: MINIO_ROOT_PASSWORD has a default (<withheld>); a missing credential must stop the stack
# expect-absent: fakesecret
services:
  minio:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fakesecret}
