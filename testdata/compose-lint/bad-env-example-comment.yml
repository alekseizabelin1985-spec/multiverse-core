# Rule 7, the .env.example half. This compose file is deliberately clean: the
# defect is in its paired example file, bad-env-example-comment.env, where an
# empty variable carries an inline comment. Compose's dotenv parser trims a
# trailing comment only after a non-empty value, so `MINIO_ROOT_USER=  # ...`
# arrives as the text of its own comment — non-empty, which silences ${VAR:?}
# and starts MinIO with a rubbish root user (T-397).
#
# expect-rule: 7
# expect-text: is empty and carries an inline comment
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
    ports:
      - "127.0.0.1:9000:9000"
