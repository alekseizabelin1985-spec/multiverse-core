# Rule 3 and a plain scalar continued on the next line (T-429; T-413 review
# #2, "for T-429"). `MV_LLM_API_KEY:` with the value one line below is a key
# WITH a value to YAML, and compose v5.2.0 hands the container the literal. The
# line reader saw a key with no value — legitimate for this key, whose empty
# value is the local case — and a line that was not a key at all. Placeholder,
# never a key.
#
# expect-rule: 3
# expect-text: MV_LLM_API_KEY carries the literal
services:
  core:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_LLM_API_KEY:
        fixture-only-not-a-key
