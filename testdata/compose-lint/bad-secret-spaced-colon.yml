# Rule 3 with the colons aligned: `KEY : value` is a key to YAML and to compose
# (v5.2 reads `A7 : spaced` as A7). The linter before T-413 rejected both lines
# below; the first T-413 key pattern wanted the colon flush and let them through
# in silence — a literal password and a bare required credential (T-413
# review #1 Ma-1, SEC-14). Placeholder, never a credential.
#
# One space before the first colon, several before the second: aligning in a
# column is the layout that hides the key, and a pattern that allows only one
# space loses the password line (T-413 review #2 N-1).
#
# expect-rule: 3
# expect-text: MINIO_ROOT_USER is passed through with no value
# expect-text: MINIO_ROOT_PASSWORD carries the literal
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      MINIO_ROOT_USER :
      MINIO_ROOT_PASSWORD      : fixture-only-not-a-secret-0000
