# A clean file for rule 9 (T-469): the variables the table keeps out of the
# containers are not asked of the services that would be their readers.
# MV_BACKUP_AGE_RECIPIENT is the public key `age` uses on the host, and the
# gateway, whose links.db it encrypts, does not pass it; MV_SWARM_FAKE is the
# hook of I1-α for a process started by hand, and the service running swarm
# does not pass it either. A service without --contexts and without the bot's
# entrypoint (a one-off `health`) is not the rule's at all. The swarm service
# writes `environment` as a list.
services:
  gateway:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    command: ["--contexts=gateway"]
    environment:
      MV_ENV: ${MV_ENV:-dev}
      MV_LOG_LEVEL: ${MV_LOG_LEVEL:-info}
      MV_LOG_FORMAT: ${MV_LOG_FORMAT:-json}
      MV_MODE: ${MV_MODE:-live}
      MV_BUS: ${MV_BUS:-kafka}
      MV_BUS_VALIDATE_ON_READ: ${MV_BUS_VALIDATE_ON_READ:-true}
      MV_KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-127.0.0.1:19092}
      MV_CORE_ADDR: ":8088"
      MV_CORE_ADMIN_CLIENTS:
      MV_MINIO_ENDPOINT: ${MV_MINIO_ENDPOINT:-127.0.0.1:9000}
      MV_MINIO_ACCESS_KEY: ${MV_MINIO_ACCESS_KEY:?set MV_MINIO_ACCESS_KEY in .env}
      MV_MINIO_SECRET_KEY: ${MV_MINIO_SECRET_KEY:?set MV_MINIO_SECRET_KEY in .env}
      MV_MINIO_USE_SSL: ${MV_MINIO_USE_SSL:-false}
      MV_WORLD_ID: ${MV_WORLD_ID:-dark-forest-world}
      MV_GATEWAY_DATA_DIR: ${MV_GATEWAY_DATA_DIR:-/data}
      MV_GATEWAY_CLIENT_IDS:
      MV_GATEWAY_ACTOR_KIND_CLIENTS:
      MV_CORE_URL: ${MV_CORE_URL:-http://127.0.0.1:8090}
      MV_GM_PATH: ${MV_GM_PATH:-agent}
      MV_GATEWAY_RATE_ACTIONS_PER_MIN: ${MV_GATEWAY_RATE_ACTIONS_PER_MIN:-30}
      MV_GATEWAY_RATE_ACTIONS_BURST: ${MV_GATEWAY_RATE_ACTIONS_BURST:-5}
      MV_GATEWAY_INPUT_FILTER: ${MV_GATEWAY_INPUT_FILTER:-noop}
      MV_GATEWAY_ENCOUNTER_GRACE: ${MV_GATEWAY_ENCOUNTER_GRACE:-10s}
      MV_GATEWAY_SESSION_IDLE: ${MV_GATEWAY_SESSION_IDLE:-30m}
      MV_GATEWAY_TURN_TIMEOUT: ${MV_GATEWAY_TURN_TIMEOUT:-60s}
      MV_GATEWAY_CHARACTER_WAIT: ${MV_GATEWAY_CHARACTER_WAIT:-2s}
      MV_GATEWAY_CHARACTER_DEADLINE: ${MV_GATEWAY_CHARACTER_DEADLINE:-60s}
      MV_GATEWAY_DELIVERY_LEASE: ${MV_GATEWAY_DELIVERY_LEASE:-30s}
      MV_GATEWAY_DELIVERY_TTL: ${MV_GATEWAY_DELIVERY_TTL:-24h}
  swarm:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    command: ["--contexts=swarm"]
    environment:
      - MV_ENV=${MV_ENV:-dev}
      - MV_LOG_LEVEL=${MV_LOG_LEVEL:-info}
      - MV_LOG_FORMAT=${MV_LOG_FORMAT:-json}
      - MV_MODE=${MV_MODE:-live}
      - MV_BUS=${MV_BUS:-kafka}
      - MV_BUS_VALIDATE_ON_READ=${MV_BUS_VALIDATE_ON_READ:-true}
      - MV_KAFKA_BROKERS=${MV_KAFKA_BROKERS:-127.0.0.1:19092}
      - MV_CORE_ADDR=:8090
      - MV_CORE_ADMIN_CLIENTS
      - MV_GM_PATH=${MV_GM_PATH:-agent}
      - MV_MEMORY_URL=${MV_MEMORY_URL:-}
      - MV_RULES_PATH=${MV_RULES_PATH:-rules/dark-forest.yaml}
  probe:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    command: ["health"]
