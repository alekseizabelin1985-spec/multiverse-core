# Rule 9 and `--contexts=all`, the one process of every context (T-469 review
# #1 Mi-2): `all` means every context, not the process alone. The service
# passes every variable a context or the process reads but MV_EMBED_MODEL,
# which the context memory alone reads — a linter that took `all` for the
# process alone (mutant MA) would pass the file.
#
# expect-rule: 9
# expect-text: platform: MV_EMBED_MODEL is read by the context memory
# expect-text: (--contexts=all)
services:
  platform:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    command: ["--contexts=all"]
    environment:
      MV_ENV: ${MV_ENV:-dev}
      MV_LOG_LEVEL: ${MV_LOG_LEVEL:-info}
      MV_LOG_FORMAT: ${MV_LOG_FORMAT:-json}
      MV_MODE: ${MV_MODE:-live}
      MV_BUS: ${MV_BUS:-kafka}
      MV_BUS_VALIDATE_ON_READ: ${MV_BUS_VALIDATE_ON_READ:-true}
      MV_KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-127.0.0.1:19092}
      MV_CORE_ADDR: ":8090"
      MV_CORE_ADMIN_CLIENTS:
      MV_MINIO_ENDPOINT: ${MV_MINIO_ENDPOINT:-127.0.0.1:9000}
      MV_MINIO_ACCESS_KEY: ${MV_MINIO_ACCESS_KEY:?set MV_MINIO_ACCESS_KEY in .env}
      MV_MINIO_SECRET_KEY: ${MV_MINIO_SECRET_KEY:?set MV_MINIO_SECRET_KEY in .env}
      MV_MINIO_USE_SSL: ${MV_MINIO_USE_SSL:-false}
      MV_WORLD_ID: ${MV_WORLD_ID:-dark-forest-world}
      MV_GATEWAY_DATA_DIR: ${MV_GATEWAY_DATA_DIR:-/data}
      MV_GATEWAY_CLIENT_IDS:
      MV_GATEWAY_ACTOR_KIND_CLIENTS:
      MV_CORE_URL: ${MV_CORE_URL:-http://127.0.0.1:8090}
      MV_GM_PATH: ${MV_GM_PATH:-agent}
      MV_GATEWAY_RATE_ACTIONS_PER_MIN: ${MV_GATEWAY_RATE_ACTIONS_PER_MIN:-30}
      MV_GATEWAY_RATE_ACTIONS_BURST: ${MV_GATEWAY_RATE_ACTIONS_BURST:-5}
      MV_GATEWAY_INPUT_FILTER: ${MV_GATEWAY_INPUT_FILTER:-noop}
      MV_GATEWAY_SESSION_IDLE: ${MV_GATEWAY_SESSION_IDLE:-30m}
      MV_GATEWAY_TURN_TIMEOUT: ${MV_GATEWAY_TURN_TIMEOUT:-60s}
      MV_GATEWAY_CHARACTER_WAIT: ${MV_GATEWAY_CHARACTER_WAIT:-2s}
      MV_GATEWAY_CHARACTER_DEADLINE: ${MV_GATEWAY_CHARACTER_DEADLINE:-60s}
      MV_GATEWAY_DELIVERY_LEASE: ${MV_GATEWAY_DELIVERY_LEASE:-30s}
      MV_GATEWAY_DELIVERY_TTL: ${MV_GATEWAY_DELIVERY_TTL:-24h}
      MV_GATEWAY_ENCOUNTER_GRACE: ${MV_GATEWAY_ENCOUNTER_GRACE:-10s}
      MV_SNAPSHOT_EVERY_FACTS: ${MV_SNAPSHOT_EVERY_FACTS:-200}
      MV_STATE_WORLDS: ${MV_STATE_WORLDS:-dark-forest-world}
      MV_LAWS_BREACH_PHASE: ${MV_LAWS_BREACH_PHASE:-false}
      MV_MEMORY_URL: ${MV_MEMORY_URL:-}
      MV_LLM_PROVIDER: ${MV_LLM_PROVIDER:-openai_compat}
      MV_LLM_URL: "${MV_LLM_URL:?MV_LLM_URL is required}"
      MV_LLM_API_KEY: ${MV_LLM_API_KEY:-}
      MV_LLM_NUM_CTX: ${MV_LLM_NUM_CTX:-8192}
      MV_LLM_STORE_PROMPTS: ${MV_LLM_STORE_PROMPTS:-false}
      MV_LLM_CLOUD_ENABLED: ${MV_LLM_CLOUD_ENABLED:-false}
      MV_LLM_CLOUD_ALLOW_EXTERNAL_PLAYERS: ${MV_LLM_CLOUD_ALLOW_EXTERNAL_PLAYERS:-false}
      MV_LLM_CLOUD_BUDGET_USD_PER_DAY: ${MV_LLM_CLOUD_BUDGET_USD_PER_DAY:-0}
      MV_ANTHROPIC_API_KEY: ${MV_ANTHROPIC_API_KEY:-}
      MV_OLLAMA_URL: ${MV_OLLAMA_URL:-}
      MV_QDRANT_ADDR: ${MV_QDRANT_ADDR:-127.0.0.1:6334}
      MV_NEO4J_URI: ${MV_NEO4J_URI:-neo4j://127.0.0.1:7687}
      MV_NEO4J_USER: ${MV_NEO4J_USER:-neo4j}
      MV_NEO4J_PASSWORD: ${MV_NEO4J_PASSWORD:?set MV_NEO4J_PASSWORD in .env}
