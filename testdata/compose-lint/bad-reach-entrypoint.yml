# Rule 9 and where the arguments of the process are (T-469 review #1 N-2).
# memory-a gives --contexts in the rest of an entrypoint /multiverse and has no
# command; memory-b gives the flag twice in its command, and the Go flag
# package keeps the last one, so it runs memory, not gateway. Both pass every
# variable of the process and of memory but MV_EMBED_MODEL. A linter that read
# the command alone would say nothing about memory-a; one that kept the first
# flag would ask memory-b for the variables of the gateway instead.
#
# expect-rule: 9
# expect-text: memory-a: MV_EMBED_MODEL is read by the context memory, which this service runs (--contexts=memory)
# expect-text: memory-b: MV_EMBED_MODEL is read by the context memory, which this service runs (--contexts=memory)
services:
  memory-a:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    entrypoint: ["/multiverse", "--contexts=memory"]
    environment:
      MV_ENV: ${MV_ENV:-dev}
      MV_LOG_LEVEL: ${MV_LOG_LEVEL:-info}
      MV_LOG_FORMAT: ${MV_LOG_FORMAT:-json}
      MV_MODE: ${MV_MODE:-live}
      MV_BUS: ${MV_BUS:-kafka}
      MV_BUS_VALIDATE_ON_READ: ${MV_BUS_VALIDATE_ON_READ:-true}
      MV_KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-127.0.0.1:19092}
      MV_CORE_ADDR: ":8090"
      MV_CORE_ADMIN_CLIENTS:
      MV_QDRANT_ADDR: ${MV_QDRANT_ADDR:-127.0.0.1:6334}
      MV_NEO4J_URI: ${MV_NEO4J_URI:-neo4j://127.0.0.1:7687}
      MV_NEO4J_USER: ${MV_NEO4J_USER:-neo4j}
      MV_NEO4J_PASSWORD: ${MV_NEO4J_PASSWORD:?set MV_NEO4J_PASSWORD in .env}
  memory-b:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    command: ["--contexts=gateway", "--contexts=memory"]
    environment:
      MV_ENV: ${MV_ENV:-dev}
      MV_LOG_LEVEL: ${MV_LOG_LEVEL:-info}
      MV_LOG_FORMAT: ${MV_LOG_FORMAT:-json}
      MV_MODE: ${MV_MODE:-live}
      MV_BUS: ${MV_BUS:-kafka}
      MV_BUS_VALIDATE_ON_READ: ${MV_BUS_VALIDATE_ON_READ:-true}
      MV_KAFKA_BROKERS: ${MV_KAFKA_BROKERS:-127.0.0.1:19092}
      MV_CORE_ADDR: ":8090"
      MV_CORE_ADMIN_CLIENTS:
      MV_QDRANT_ADDR: ${MV_QDRANT_ADDR:-127.0.0.1:6334}
      MV_NEO4J_URI: ${MV_NEO4J_URI:-neo4j://127.0.0.1:7687}
      MV_NEO4J_USER: ${MV_NEO4J_USER:-neo4j}
      MV_NEO4J_PASSWORD: ${MV_NEO4J_PASSWORD:?set MV_NEO4J_PASSWORD in .env}
