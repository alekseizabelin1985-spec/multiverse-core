# Rule 3 and a literal that YAML reads as a number (T-429 review #1 N-1). The
# container gets the text `1234567890` as its key all the same. The line reader
# of T-413 let it pass; a reader that took a non-string for "no value" would
# too, since for a secret outside the required set that is silence. The
# refusal names the key but not the value (T-464 review #1 N-2).
# Placeholder, never a key.
#
# expect-rule: 3
# expect-text: MV_LLM_API_KEY carries the literal <withheld>
# expect-absent: 1234567890
services:
  core:
    image: multiverse-core:${MV_IMAGE_TAG:-dev}
    environment:
      MV_LLM_API_KEY: 1234567890
