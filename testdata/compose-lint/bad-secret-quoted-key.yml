# Rule 3: the key of bad-secret-passthrough.yml, quoted. YAML reads
# `"MINIO_ROOT_USER":` exactly as `MINIO_ROOT_USER:` — a key with no value, so
# with .env silent MinIO starts on the account it ships with. The linter
# matched unquoted keys only (review #1 T-411, N-3; the class predates T-411).
#
# expect-rule: 3
# expect-text: MINIO_ROOT_USER is passed through with no value
services:
  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in build/versions.env}
    environment:
      "MINIO_ROOT_USER":
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
